window.toggleMensualidad = async (deudaId, idx) => {
  const d = deudas.find(x=>x.id===deudaId);
  if(!d) return;
  const marcandoComoPagado = !d.pagos[idx].pagado;
  d.pagos[idx].pagado = marcandoComoPagado;

  if(marcandoComoPagado){
    const ahorrado = ahorradoDeuda(d);
    if(ahorrado > 0){
      const usar = confirm(`¿Quieres descontar el pago de ${fmt(d.pagoMensual||0)} de tu ahorrado para esta deuda? (Ahorrado actual: ${fmt(ahorrado)})`);
      if(usar){
        if(!d.aportacionesAhorro) d.aportacionesAhorro=[];
        d.aportacionesAhorro.push({fecha:new Date().toISOString().split('T')[0], monto:-(d.pagoMensual||0), nota:`Descuento por pago: ${d.pagos[idx].label}`});
      }
    }
  }

  await updateDoc(doc(db,'users',uid,'deudas',deudaId),{pagos:d.pagos, aportacionesAhorro:d.aportacionesAhorro||[]});
  openDeudaDetail(deudaId);
  renderDeudas();
};

window.agregarAportacionDeuda = async (deudaId) => {
  const d = deudas.find(x=>x.id===deudaId);
  if(!d) return;
  const fecha = document.getElementById('da-fecha').value;
  const monto = parseFloat(document.getElementById('da-monto').value)||0;
  const nota = document.getElementById('da-nota').value.trim();
  if(!monto||!fecha) return alert('Ingresa fecha y monto.');
  if(!d.aportacionesAhorro) d.aportacionesAhorro=[];
  d.aportacionesAhorro.push({fecha,monto,nota});
  await updateDoc(doc(db,'users',uid,'deudas',deudaId),{aportacionesAhorro:d.aportacionesAhorro});
  openDeudaDetail(deudaId);
  renderDeudas();
};

window.eliminarAportacionDeuda = async (deudaId, idx) => {
  const d = deudas.find(x=>x.id===deudaId);
  if(!d) return;
  const realIdx = d.aportacionesAhorro.length - 1 - idx;
  d.aportacionesAhorro.splice(realIdx,1);
  await updateDoc(doc(db,'users',uid,'deudas',deudaId),{aportacionesAhorro:d.aportacionesAhorro});
  openDeudaDetail(deudaId);
  renderDeudas();
};

window.liquidarDeuda = async (id) => {
  if(!confirm('¿Marcar esta deuda como liquidada?')) return;
  const d = deudas.find(x=>x.id===id);
  if(!d) return;
  d.liquidada = true;
  await updateDoc(doc(db,'users',uid,'deudas',id),{liquidada:true});
  renderDeudas();
};

window.eliminarDeuda = async (id) => {
  if(!confirm('¿Eliminar esta deuda permanentemente?')) return;
  await deleteDoc(doc(db,'users',uid,'deudas',id));
  deudas = deudas.filter(x=>x.id!==id);
  renderDeudas();
};


// ── AHORROS ──
let ahorros = [];

async function loadAhorros(){
  const snap = await getDocs(collection(db,'users',uid,'ahorros'));
  ahorros = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.creadoEn||0)-(b.creadoEn||0));
}

async function renderAhorros(){
  const cont = document.getElementById('ahorros-content');
  cont.innerHTML = '<div class="spinner"></div>';
  if(!ahorros.length) await loadAhorros();

  const totalAhorrado = ahorros.reduce((s,a)=>(a.aportaciones||[]).reduce((ss,ap)=>ss+(ap.monto||0),s),0);
  const totalMeta = ahorros.reduce((s,a)=>s+(a.meta||0),0);

  const cards = ahorros.map(a=>{
    const ahorrado = (a.aportaciones||[]).reduce((s,ap)=>s+(ap.monto||0),0);
    const pct = a.meta>0?Math.min(100,Math.round(ahorrado/a.meta*100)):0;
    return `<div class="ahorro-card" onclick="openAhorroDetail('${a.id}')">
      <div class="ahorro-card-body">
        <div class="ahorro-concepto">${a.concepto}</div>
        <div class="ahorro-banco">${a.banco||'Sin banco especificado'}</div>
        <div class="ahorro-prog-wrap"><div class="ahorro-prog-bar" style="width:${pct}%"></div></div>
        <div class="ahorro-nums"><span>$0</span><span>${fmt(a.meta||0)}</span></div>
        <div class="ahorro-ahorrado">${fmt(ahorrado)}</div>
        <div class="ahorro-meta">Meta: ${fmt(a.meta||0)}</div>
        <div class="ahorro-pct">${pct}% completado</div>
      </div>
      <div class="ahorro-card-footer">
        <span style="font-size:12px;color:var(--text3)">${(a.aportaciones||[]).length} aportación(es)</span>
        <button class="del-btn" onclick="event.stopPropagation();eliminarAhorro('${a.id}')">✕</button>
      </div>
    </div>`;
  }).join('');

  cont.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div>
        <div style="font-family:'Instrument Serif',serif;font-size:28px;letter-spacing:-.3px">Ahorros</div>
        <div style="font-size:13px;color:var(--text3);margin-top:2px">${ahorros.length} objetivo(s)</div>
      </div>
      <button class="add-btn" onclick="openNuevoAhorro()">+ Nuevo ahorro</button>
    </div>
    ${ahorros.length ? `<div class="mes-stats" style="grid-template-columns:repeat(2,1fr);margin-bottom:24px">
      <div class="stat-card"><div class="stat-label">Total ahorrado</div><div class="stat-value" style="color:var(--green)">${fmt(totalAhorrado)}</div><div class="stat-sub">En todos los objetivos</div></div>
      <div class="stat-card"><div class="stat-label">Total metas</div><div class="stat-value" style="color:var(--amber)">${fmt(totalMeta)}</div><div class="stat-sub">${totalMeta>0?Math.round(totalAhorrado/totalMeta*100):0}% alcanzado</div></div>
    </div>` : ''}
    ${ahorros.length ? `<div class="ahorros-grid">${cards}</div>` : '<div class="empty" style="margin-top:40px">Sin objetivos de ahorro. Agrega el primero.</div>'}
  `;
}

window.openNuevoAhorro = () => {
  showModal(`<div class="modal-title">Nuevo objetivo de ahorro</div>
    <div class="f-row"><label>Concepto</label><input id="ah-concepto" class="modal-input" placeholder="Ej: Vacaciones, fondo de emergencia..."></div>
    <div class="f-row"><label>Meta ($)</label><input id="ah-meta" class="modal-input" type="number" placeholder="0.00"></div>
    <div class="f-row"><label>Se ahorra en (banco / cuenta)</label><input id="ah-banco" class="modal-input" placeholder="Ej: BBVA, Mercado Pago, efectivo..."></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-primary" onclick="guardarAhorro()">Crear</button>
      <button class="modal-btn modal-btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>`);
};

window.guardarAhorro = async () => {
  const concepto = document.getElementById('ah-concepto').value.trim();
  const meta = parseFloat(document.getElementById('ah-meta').value)||0;
  const banco = document.getElementById('ah-banco').value.trim();
  if(!concepto) return alert('Escribe un concepto.');
  const id = Date.now().toString();
  const obj = {concepto,meta,banco,aportaciones:[],creadoEn:Date.now()};
  await setDoc(doc(db,'users',uid,'ahorros',id),obj);
  ahorros.push({id,...obj});
  closeModal(); renderAhorros();
};

window.openAhorroDetail = (id) => {
  const a = ahorros.find(x=>x.id===id);
  if(!a) return;
  const aportaciones = a.aportaciones||[];
  const ahorrado = aportaciones.reduce((s,ap)=>s+(ap.monto||0),0);
  const pct = a.meta>0?Math.min(100,Math.round(ahorrado/a.meta*100)):0;
  const today = new Date().toISOString().split('T')[0];

  const histHTML = aportaciones.length
    ? [...aportaciones].reverse().map((ap,i)=>`
        <div class="aport-row">
          <span class="aport-fecha">${fmtDate(ap.fecha)}</span>
          <span style="font-size:13px;color:var(--text2)">${ap.nota||''}</span>
          <span class="aport-monto">+${fmt(ap.monto)}</span>
          <button class="aport-del" onclick="eliminarAportacion('${id}',${aportaciones.length-1-i})">✕</button>
        </div>`).join('')
    : '<div style="font-size:12px;color:var(--text3);padding:8px 0">Sin aportaciones aún.</div>';

  showModal(`<div class="modal-title">${a.concepto}</div>
    <div style="background:var(--surface2);border-radius:var(--rs);padding:14px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:13px;color:var(--text2)">Ahorrado</span>
        <span style="font-size:13px;font-weight:600;color:var(--green)">${fmt(ahorrado)} / ${fmt(a.meta||0)}</span>
      </div>
      <div class="ahorro-prog-wrap" style="height:8px"><div class="ahorro-prog-bar" style="width:${pct}%"></div></div>
      <div style="font-size:12px;color:var(--amber);margin-top:6px;text-align:right">${pct}% · ${a.banco||'Sin banco'}</div>
    </div>
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:10px">Agregar aportación</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <input id="ap-fecha" class="modal-input" type="date" value="${today}">
      <input id="ap-monto" class="modal-input" type="number" placeholder="Monto">
    </div>
    <input id="ap-nota" class="modal-input" placeholder="Nota (opcional)" style="margin-bottom:8px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
      <button class="modal-btn modal-btn-primary" onclick="agregarAportacion('${id}', 1)">+ Aportación</button>
      <button class="modal-btn" style="background:var(--red-dim);border-color:var(--red-border);color:var(--red)" onclick="agregarAportacion('${id}', -1)">− Retiro</button>
    </div>
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:10px">Historial</div>
    <div class="mensualidades-list">${histHTML}</div>
    <div class="modal-actions" style="margin-top:12px">
      <button class="modal-btn modal-btn-ghost" onclick="closeModal()">Cerrar</button>
    </div>`);
};

window.agregarAportacion = async (id, signo=1) => {
  const a = ahorros.find(x=>x.id===id);
  if(!a) return;
  const fecha = document.getElementById('ap-fecha').value;
  const monto = parseFloat(document.getElementById('ap-monto').value)||0;
  const nota = document.getElementById('ap-nota').value.trim();
  if(!monto||!fecha) return alert('Ingresa fecha y monto.');
  if(!a.aportaciones) a.aportaciones=[];
  a.aportaciones.push({fecha, monto: monto * signo, nota: nota || (signo<0?'Retiro':'')});
  await updateDoc(doc(db,'users',uid,'ahorros',id),{aportaciones:a.aportaciones});
  openAhorroDetail(id);
  renderAhorros();
};

window.eliminarAportacion = async (id, idx) => {
  const a = ahorros.find(x=>x.id===id);
  if(!a) return;
  // idx is from reversed array, convert back
  const realIdx = a.aportaciones.length - 1 - idx;
  a.aportaciones.splice(realIdx,1);
  await updateDoc(doc(db,'users',uid,'ahorros',id),{aportaciones:a.aportaciones});
  openAhorroDetail(id);
  renderAhorros();
};

window.eliminarAhorro = async (id) => {
  if(!confirm('¿Eliminar este objetivo de ahorro?')) return;
  await deleteDoc(doc(db,'users',uid,'ahorros',id));
  ahorros = ahorros.filter(x=>x.id!==id);
  renderAhorros();
};


// ── VIAJES ──
let viajes = [];
let metodosPago = [];
let viajeActivo = null; // id del viaje abierto en detalle

async function loadViajes(){
  const [vSnap, mpSnap] = await Promise.all([
    getDocs(collection(db,'users',uid,'viajes')),
    getDocs(collection(db,'users',uid,'metodosPago'))
  ]);
  viajes = vSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.creadoEn||0)-(a.creadoEn||0));
  metodosPago = mpSnap.docs.map(d=>({id:d.id,...d.data()}));
  if(!metodosPago.length){
    // defaults
    const defaults = ['Efectivo MXN','Efectivo USD','Tarjeta débito','Tarjeta crédito'];
    for(const nombre of defaults){
      const id = Date.now().toString() + Math.random();
      await setDoc(doc(db,'users',uid,'metodosPago',id.toString()),{nombre});
      metodosPago.push({id,nombre});
    }
  }
}

  const cont = document.getElementById('viajes-content');
  cont.innerHTML = '<div class="spinner"></div>';
  if(!viajes.length) await loadViajes();

  const totalMXN = viajes.reduce((s,v)=>(v.gastos||[]).reduce((ss,g)=>ss+(g.mxn||0),s),0);
  const totalUSD = viajes.reduce((s,v)=>(v.gastos||[]).reduce((ss,g)=>ss+(g.usd||0),s),0);

  const mpChips = metodosPago.map(mp=>`
    <div class="mp-chip">
      <span>${mp.nombre}</span>

    </div>`).join('');

  const mpOpts = metodosPago.map(mp=>`<option value="${mp.nombre}">${mp.nombre}</option>`).join('');

  cont.innerHTML = `

      <div>
        <div style="font-family:'Instrument Serif',serif;font-size:28px;letter-spacing:-.3px">Viajes</div>

window.toggleViaje = (id) => {
  const card = document.getElementById('vc-'+id);

function renderCalBody(mes, data){
  const body = document.getElementById('cal-body');
  const today = new Date();
  today.setHours(0,0,0,0);

  // Detect year/month from mes nombre or fallback to today
  const MESES_MAP = {enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,octubre:9,noviembre:10,diciembre:11};
  let calYear = today.getFullYear(), calMonth = today.getMonth();
  const nombreLower = mes.nombre.toLowerCase();
  for(const [k,v] of Object.entries(MESES_MAP)){
    if(nombreLower.includes(k)){
      calMonth = v;
      const yearMatch = mes.nombre.match(/\d{4}/);
      if(yearMatch) calYear = parseInt(yearMatch[0]);
      break;
    }
  }

  // Build event map: {day -> [events]}
  const eventMap = {};
  const addEvent = (day, ev) => {
    if(!eventMap[day]) eventMap[day] = [];
    eventMap[day].push(ev);
  };

  // Ingresos
  data.ingresos.forEach(ing=>{
    if(!ing.fecha) return;
    const d = new Date(ing.fecha+'T12:00:00');
    if(d.getFullYear()===calYear && d.getMonth()===calMonth){
      addEvent(d.getDate(), {tipo:'ingreso', label: ing.cliente, monto: ing.total||0, pagado: ing.pagado});
    }
  });

  // Gastos
  data.gastos.forEach(g=>{
    if(!g.fecha) return;
    const d = new Date(g.fecha+'T12:00:00');
    if(d.getFullYear()===calYear && d.getMonth()===calMonth){
      addEvent(d.getDate(), {tipo:'gasto', label: g.descripcion, monto: g.monto||0, pagado: g.pagado, personal: g.prioridad==='personal'});
    }
  });

  // Calendar math
  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay = new Date(calYear, calMonth+1, 0);
  const startDow = firstDay.getDay(); // 0=Sun
  const totalDays = lastDay.getDate();
  const DAY_LABELS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  const dayLabels = DAY_LABELS.map(d=>`<div class="cal-day-label">${d}</div>`).join('');

  // Cells: leading empty + days + trailing empty
  let cells = '';

  // Leading blanks
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell other-month"></div>`;

  // Days
  for(let d=1;d<=totalDays;d++){
    const thisDate = new Date(calYear, calMonth, d);
    thisDate.setHours(0,0,0,0);
    const isToday = thisDate.getTime()===today.getTime();
    const events = eventMap[d]||[];
    const hasEvents = events.length>0;

    const evHTML = events.slice(0,4).map(ev=>{
      let cls, dotColor, check='';
      const mxn = '$'+(ev.monto||0).toLocaleString('es-MX',{maximumFractionDigits:0});
      if(ev.tipo==='ingreso'){
        cls='ingreso'; dotColor='var(--green)';
        check = ev.pagado ? ' ✓' : '';
      } else if(ev.personal){
        cls='gasto'; dotColor='var(--purple)'; check = ev.pagado?' ✓':'';
      } else if(ev.pagado){
        cls='gasto-pagado'; dotColor='var(--green)'; check=' ✓';
      } else {
        cls='gasto'; dotColor='var(--red)'; check='';
      }
      const label = ev.label.length>14 ? ev.label.substring(0,13)+'…' : ev.label;
      return `<div class="cal-event ${cls}" title="${ev.label} · ${ev.tipo==='ingreso'?'+':'−'}${mxn}${ev.pagado?' · ✓ Pagado':''}">
        <span style="width:5px;height:5px;border-radius:50%;background:${dotColor};flex-shrink:0;display:inline-block"></span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${label}${check}</span>
      </div>`;
    }).join('');
    const moreHTML = events.length>4 ? `<div style="font-size:9px;color:var(--text3);padding:1px 4px">+${events.length-4} más</div>` : '';

    cells += `<div class="cal-cell ${isToday?'today':''} ${hasEvents?'has-events':''}">
      <div class="cal-day-num">
        <span>${d}</span>
        ${isToday?'<span class="today-dot"></span>':''}
      </div>
      ${evHTML}${moreHTML}
    </div>`;
  }

  // Trailing blanks to complete last row
  const totalCells = startDow + totalDays;
  const trailing = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for(let i=0;i<trailing;i++) cells += `<div class="cal-cell other-month"></div>`;

  body.innerHTML = `
    <div class="cal-legend">
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--green)"></div>Ingreso (✓ cobrado)</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--red)"></div>Gasto pendiente</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--green);opacity:.6"></div>Gasto pagado ✓</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--purple)"></div>Personal</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--gold)"></div>Hoy</div>
    </div>
    <div style="font-size:13px;font-weight:500;color:var(--text2);margin-bottom:12px;text-align:center">${MONTH_NAMES[calMonth]} ${calYear}</div>
    <div class="cal-grid">
      ${dayLabels}
      ${cells}
    </div>
  `;
}

window.exportarExcel = async () => {
  // Make sure all month data is loaded
  for(const m of meses) if(!mesData[m.id]) await loadMesData(m.id);

  const WB = XLSX.utils.book_new();
  const year = new Date().getFullYear();

  // ── Styles helper (background + font) ──
  const cs = (bgHex, bold=false, color='FF000000', sz=11, align='left') => ({
    fill:{patternType:'solid', fgColor:{rgb:bgHex}},
    font:{bold, color:{rgb:color}, sz, name:'Arial'},
    alignment:{horizontal:align, vertical:'center', wrapText:true},
    border:{top:{style:'thin',color:{rgb:'FFE0E0E0'}},bottom:{style:'thin',color:{rgb:'FFE0E0E0'}},left:{style:'thin',color:{rgb:'FFE0E0E0'}},right:{style:'thin',color:{rgb:'FFE0E0E0'}}}
  });

  const HEADER_BG   = '1A1A2E'; // dark navy
  const INCOME_BG   = 'E8F8F0'; // light green
  const EXPENSE_BG  = 'FEF2F2'; // light red
  const PAID_BG     = 'F0FFF4'; // mint
  const SUMMARY_BG  = 'FFF8E1'; // light amber
  const TITLE_BG    = '0D1B2A'; // very dark

  const currency = v => ({t:'n', v: v||0, z:'$#,##0.00'});
  const pct      = v => ({t:'n', v: (v||0)/100, z:'0.0%'});

  // ══════════════════════════════════════
  // HOJA 1: RESUMEN AÑO
  // ══════════════════════════════════════
  const wsResumen = XLSX.utils.aoa_to_sheet([]);
  const rData = [];

  // Title
  rData.push([{v:`Resumen Anual ${year}`, s:cs(TITLE_BG,true,'FFC9A96E',16,'center')},'','','','','','']);

  // Summary stats
  const totalFact = meses.reduce((s,m)=>(mesData[m.id]?.ingresos||[]).reduce((ss,i)=>ss+(i.total||0),s),0);
  const totalCob  = meses.reduce((s,m)=>(mesData[m.id]?.ingresos||[]).filter(i=>i.pagado).reduce((ss,i)=>ss+(i.total||0),s),0);
  const totalGas  = meses.reduce((s,m)=>(mesData[m.id]?.gastos||[]).reduce((ss,g)=>ss+(g.monto||0),s),0);
  const totalCF   = meses.reduce((s,m)=>(mesData[m.id]?.ingresos||[]).reduce((ss,i)=>{
    const b=(i.bolsas||[]).find(b=>b.esCashflow||b.tipo==='cashflow');return ss+(b?b.monto:0);},s),0);
  const totalProfit = totalCF - totalGas;

  rData.push(['']);
  rData.push([{v:'Total facturado',s:cs(SUMMARY_BG,true)},{v:'Total cobrado',s:cs(SUMMARY_BG,true)},{v:'Cashflow total',s:cs(SUMMARY_BG,true)},{v:'Total gastos',s:cs(SUMMARY_BG,true)},{v:'Profit estimado',s:cs(SUMMARY_BG,true)},'','']);
  rData.push([currency(totalFact),currency(totalCob),currency(totalCF),currency(totalGas),currency(totalProfit),'','']);
  rData.push(['']);

  // Table header
  rData.push([
    {v:'Mes',s:cs(HEADER_BG,true,'FFFFFFFF')},
    {v:'Facturado',s:cs(HEADER_BG,true,'FFFFFFFF')},
    {v:'Cobrado',s:cs(HEADER_BG,true,'FFFFFFFF')},
    {v:'Pendiente',s:cs(HEADER_BG,true,'FFFFFFFF')},
    {v:'Cashflow',s:cs(HEADER_BG,true,'FFFFFFFF')},
    {v:'Gastos',s:cs(HEADER_BG,true,'FFFFFFFF')},
    {v:'Profit',s:cs(HEADER_BG,true,'FFFFFFFF')}
  ]);

  meses.forEach(m=>{
    const d = mesData[m.id]||{ingresos:[],gastos:[]};
    const fact = d.ingresos.reduce((s,i)=>s+(i.total||0),0);
    const cob  = d.ingresos.filter(i=>i.pagado).reduce((s,i)=>s+(i.total||0),0);
    const pend = fact - cob;
    const cf   = d.ingresos.reduce((s,i)=>{const b=(i.bolsas||[]).find(b=>b.esCashflow||b.tipo==='cashflow');return s+(b?b.monto:0);},0);
    const gas  = d.gastos.reduce((s,g)=>s+(g.monto||0),0);
    const prof = cf - gas;
    rData.push([
      {v:m.nombre, s:cs('FFFFFF',true)},
      {v:fact||0, t:'n', z:'$#,##0.00', s:cs('FFFFFF')},
      {v:cob||0,  t:'n', z:'$#,##0.00', s:cs(INCOME_BG)},
      {v:pend||0, t:'n', z:'$#,##0.00', s:cs(pend>0?'FFF3E0':'FFFFFF')},
      {v:cf||0,   t:'n', z:'$#,##0.00', s:cs(INCOME_BG)},
      {v:gas||0,  t:'n', z:'$#,##0.00', s:cs(EXPENSE_BG)},
      {v:prof,    t:'n', z:'$#,##0.00', s:cs(prof>=0?INCOME_BG:EXPENSE_BG)}
    ]);
  });

  XLSX.utils.sheet_add_aoa(wsResumen, rData, {origin:'A1'});
  wsResumen['!cols'] = [{wch:18},{wch:14},{wch:14},{wch:14},{wch:14},{wch:14},{wch:14}];
  wsResumen['!merges'] = [{s:{r:0,c:0},e:{r:0,c:6}}];
  wsResumen['!rows'] = [{hpt:30},{hpt:6},{hpt:20},{hpt:22}];
  XLSX.utils.book_append_sheet(WB, wsResumen, 'Resumen Anual');

  // ══════════════════════════════════════
  // HOJA 2: CLIENTES
  // ══════════════════════════════════════
  const wsClientes = XLSX.utils.aoa_to_sheet([]);
  const clienteMap = {};
  meses.forEach(m=>{
    (mesData[m.id]?.ingresos||[]).forEach(ing=>{
      if(!clienteMap[ing.cliente]) clienteMap[ing.cliente]={total:0,cobrado:0,cf:0,pagos:0,meses:[]};
      const b=(ing.bolsas||[]).find(b=>b.esCashflow||b.tipo==='cashflow');
      clienteMap[ing.cliente].total   += ing.total||0;
      clienteMap[ing.cliente].cf      += b?b.monto:0;
      if(ing.pagado){ clienteMap[ing.cliente].cobrado+=ing.total||0; clienteMap[ing.cliente].pagos++; }
      clienteMap[ing.cliente].meses.push(m.nombre);
    });
  });

  const cData = [];
  cData.push([{v:`Resumen por Cliente ${year}`, s:cs(TITLE_BG,true,'FFC9A96E',16,'center')},'','','','','']);
  cData.push(['']);
  cData.push([
    {v:'Cliente',s:cs(HEADER_BG,true,'FFFFFFFF')},
    {v:'Total facturado',s:cs(HEADER_BG,true,'FFFFFFFF')},
    {v:'Total cobrado',s:cs(HEADER_BG,true,'FFFFFFFF')},
    {v:'Cashflow generado',s:cs(HEADER_BG,true,'FFFFFFFF')},
    {v:'Pagos recibidos',s:cs(HEADER_BG,true,'FFFFFFFF')},
    {v:'Meses activo',s:cs(HEADER_BG,true,'FFFFFFFF')}
  ]);

  Object.entries(clienteMap).sort((a,b)=>b[1].total-a[1].total).forEach(([cliente,d])=>{
    cData.push([
      {v:cliente,s:cs('FFFFFF',true)},
      {v:d.total,  t:'n', z:'$#,##0.00', s:cs('FFFFFF')},
      {v:d.cobrado,t:'n', z:'$#,##0.00', s:cs(INCOME_BG)},
      {v:d.cf,     t:'n', z:'$#,##0.00', s:cs(INCOME_BG)},
      {v:d.pagos,  t:'n', s:cs('FFFFFF','center')},
      {v:[...new Set(d.meses)].join(', '), s:cs('FFFFFF')}
    ]);
  });

  XLSX.utils.sheet_add_aoa(wsClientes, cData, {origin:'A1'});
  wsClientes['!cols']=[{wch:22},{wch:16},{wch:16},{wch:16},{wch:14},{wch:30}];
  wsClientes['!merges']=[{s:{r:0,c:0},e:{r:0,c:5}}];
  XLSX.utils.book_append_sheet(WB, wsClientes, 'Clientes');

  // ══════════════════════════════════════
  // HOJAS INDIVIDUALES POR MES
  // ══════════════════════════════════════
  meses.forEach(mes=>{
    const d = mesData[mes.id]||{ingresos:[],gastos:[]};
    const ws = XLSX.utils.aoa_to_sheet([]);
    const rows = [];

    rows.push([{v:mes.nombre, s:cs(TITLE_BG,true,'FFC9A96E',15,'center')},'','','','']);
    rows.push(['']);

    // ── Ingresos ──
    rows.push([{v:'INGRESOS', s:cs(HEADER_BG,true,'FFFFFFFF')},'','','','']);
    rows.push([
      {v:'Cliente',s:cs('2D4A3E',true,'FFFFFFFF')},
      {v:'Fecha',s:cs('2D4A3E',true,'FFFFFFFF')},
      {v:'Monto total',s:cs('2D4A3E',true,'FFFFFFFF')},
      {v:'Cashflow',s:cs('2D4A3E',true,'FFFFFFFF')},
      {v:'Estado',s:cs('2D4A3E',true,'FFFFFFFF')}
    ]);

    const ingTotFact = d.ingresos.reduce((s,i)=>s+(i.total||0),0);
    const ingTotCF   = d.ingresos.reduce((s,i)=>{const b=(i.bolsas||[]).find(b=>b.esCashflow||b.tipo==='cashflow');return s+(b?b.monto:0);},0);

    d.ingresos.forEach(ing=>{
      const b=(ing.bolsas||[]).find(b=>b.esCashflow||b.tipo==='cashflow');
      const bg = ing.pagado ? PAID_BG : 'FFFFFF';
      rows.push([
        {v:ing.cliente, s:cs(bg,true)},
        {v:ing.fecha||'', s:cs(bg)},
        {v:ing.total||0, t:'n', z:'$#,##0.00', s:cs(bg)},
        {v:b?b.monto:0,  t:'n', z:'$#,##0.00', s:cs(bg)},
        {v:ing.pagado?'✓ Cobrado':'Pendiente', s:cs(ing.pagado?PAID_BG:EXPENSE_BG,true)}
      ]);
    });
    rows.push([
      {v:'TOTAL', s:cs(INCOME_BG,true)},
      {v:'', s:cs(INCOME_BG)},
      {v:ingTotFact, t:'n', z:'$#,##0.00', s:cs(INCOME_BG,true)},
      {v:ingTotCF,   t:'n', z:'$#,##0.00', s:cs(INCOME_BG,true)},
      {v:'', s:cs(INCOME_BG)}
    ]);

    rows.push(['']);

    // ── Bolsas ──
    const todasBolsas = [];
    d.ingresos.forEach(ing=>{
      (ing.bolsas||[]).forEach(b=>{
        todasBolsas.push({cliente:ing.cliente, nombre:b.nombre, monto:b.monto||0, tipo:b.tipo||'otro'});
      });
    });
    if(todasBolsas.length){
      rows.push([{v:'DISTRIBUCIÓN DE BOLSAS', s:cs(HEADER_BG,true,'FFFFFFFF')},'','','','']);
      rows.push([
        {v:'Cliente',s:cs('4A3728',true,'FFFFFFFF')},
        {v:'Bolsa',s:cs('4A3728',true,'FFFFFFFF')},
        {v:'Monto',s:cs('4A3728',true,'FFFFFFFF')},
        {v:'Tipo',s:cs('4A3728',true,'FFFFFFFF')},
        {v:'',s:cs('4A3728')}
      ]);
      todasBolsas.forEach(b=>{
        const isCF = b.tipo==='cashflow';
        const isP  = b.tipo==='personal';
        const bg = isCF?INCOME_BG:isP?'F3E8FF':'FFFFFF';
        rows.push([
          {v:b.cliente, s:cs(bg)},
          {v:b.nombre,  s:cs(bg,true)},
          {v:b.monto,   t:'n', z:'$#,##0.00', s:cs(bg)},
          {v:isCF?'✦ Cashflow':isP?'♦ Personal':'Otro', s:cs(bg)},
          {v:'', s:cs(bg)}
        ]);
      });
      rows.push(['']);
    }

    // ── Gastos ──
    rows.push([{v:'GASTOS', s:cs(HEADER_BG,true,'FFFFFFFF')},'','','','']);
    rows.push([
      {v:'Descripción',s:cs('4A1E1E',true,'FFFFFFFF')},
      {v:'Fecha',s:cs('4A1E1E',true,'FFFFFFFF')},
      {v:'Monto',s:cs('4A1E1E',true,'FFFFFFFF')},
      {v:'Prioridad',s:cs('4A1E1E',true,'FFFFFFFF')},
      {v:'Estado',s:cs('4A1E1E',true,'FFFFFFFF')}
    ]);

    const gasTot = d.gastos.reduce((s,g)=>s+(g.monto||0),0);
    d.gastos.forEach(g=>{
      const bg = g.pagado ? PAID_BG : g.prioridad==='alta'?'FFF5F5':g.prioridad==='personal'?'F3E8FF':'FFFFFF';
      rows.push([
        {v:g.descripcion, s:cs(bg,true)},
        {v:g.fecha||'', s:cs(bg)},
        {v:g.monto||0, t:'n', z:'$#,##0.00', s:cs(bg)},
        {v:g.prioridad||'media', s:cs(bg)},
        {v:g.pagado?'✓ Pagado':'Pendiente', s:cs(g.pagado?PAID_BG:EXPENSE_BG,true)}
      ]);
    });
    rows.push([
      {v:'TOTAL', s:cs(EXPENSE_BG,true)},
      {v:'', s:cs(EXPENSE_BG)},
      {v:gasTot, t:'n', z:'$#,##0.00', s:cs(EXPENSE_BG,true)},
      {v:'', s:cs(EXPENSE_BG)},
      {v:'', s:cs(EXPENSE_BG)}
    ]);

    // ── Resumen del mes ──
    const cf = d.ingresos.reduce((s,i)=>{const b=(i.bolsas||[]).find(b=>b.esCashflow||b.tipo==='cashflow');return s+(b?b.monto:0);},0);
    const profit = cf - gasTot;
    rows.push(['']);
    rows.push([{v:'RESUMEN DEL MES', s:cs(SUMMARY_BG,true)},'','','','']);
    rows.push([{v:'Cashflow disponible',s:cs(SUMMARY_BG)},{v:cf,t:'n',z:'$#,##0.00',s:cs(SUMMARY_BG,true)},'','','']);
    rows.push([{v:'Total gastos',s:cs(SUMMARY_BG)},{v:gasTot,t:'n',z:'$#,##0.00',s:cs(EXPENSE_BG,true)},'','','']);
    rows.push([{v:'Profit estimado',s:cs(SUMMARY_BG)},{v:profit,t:'n',z:'$#,##0.00',s:cs(profit>=0?INCOME_BG:EXPENSE_BG,true)},'','','']);

    XLSX.utils.sheet_add_aoa(ws, rows, {origin:'A1'});
    ws['!cols']=[{wch:22},{wch:12},{wch:14},{wch:14},{wch:14}];
    ws['!merges']=[
      {s:{r:0,c:0},e:{r:0,c:4}},
      {s:{r:2,c:0},e:{r:2,c:4}}
    ];

    // Sanitize sheet name (max 31 chars, no special chars)
    const sheetName = mes.nombre.replace(/[\/*?:\[\]]/g,'').substring(0,31);
    XLSX.utils.book_append_sheet(WB, ws, sheetName);
  });

  // ── Download ──
  XLSX.writeFile(WB, `Cashflow_${year}.xlsx`);
};


// ── FORMAT ──
function fmt(n){return'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(d){if(!d)return'—';const[y,m,day]=d.split('-'),ms=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return`${parseInt(day)} ${ms[parseInt(m)-1]} ${y}`;}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
