<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cashflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0c0c0e;--surface:#131316;--surface2:#1c1c21;--surface3:#242429;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);
  --text:#eeecea;--text2:#888580;--text3:#4a4845;
  --green:#3ecf8e;--green-dim:rgba(62,207,142,0.1);--green-border:rgba(62,207,142,0.25);
  --red:#f06c6c;--red-dim:rgba(240,108,108,0.1);--red-border:rgba(240,108,108,0.25);
  --amber:#f5a623;--amber-dim:rgba(245,166,35,0.1);--amber-border:rgba(245,166,35,0.25);
  --blue:#5b9cf6;--blue-dim:rgba(91,156,246,0.1);--blue-border:rgba(91,156,246,0.25);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,0.1);--purple-border:rgba(167,139,250,0.25);
  --gold:#c9a96e;--gold-dim:rgba(201,169,110,0.08);--r:10px;--rs:7px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* AUTH */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.auth-box{width:100%;max-width:380px}
.auth-logo{font-family:'Instrument Serif',serif;font-size:38px;color:var(--gold);margin-bottom:6px;letter-spacing:-.5px}
.auth-sub{font-size:13px;color:var(--text3);margin-bottom:32px}
.auth-tabs{display:flex;border-bottom:1px solid var(--border2);margin-bottom:24px}
.auth-tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.auth-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.auth-form{display:none}.auth-form.active{display:block}
.f-row{margin-bottom:14px}
.f-row label{display:block;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:6px}
.f-row input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;outline:none;transition:border-color .2s}
.f-row input:focus{border-color:var(--gold)}
.auth-btn{width:100%;padding:12px;background:var(--gold);border:none;border-radius:var(--rs);color:#0c0c0e;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;transition:opacity .15s}
.auth-btn:hover{opacity:.88}
.auth-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--text3);font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border2)}
.google-btn{width:100%;padding:11px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:10px}
.google-btn:hover{background:var(--surface3)}
.google-icon{width:18px;height:18px;flex-shrink:0}
.auth-error{font-size:12px;color:var(--red);margin-top:10px;min-height:18px}

/* APP */
#app{display:none;height:100vh;overflow:hidden;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:20px}
.brand{font-family:'Instrument Serif',serif;font-size:22px;color:var(--gold);letter-spacing:-.3px}
.nav-tabs{display:flex;gap:2px}
.nav-tab{padding:6px 14px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-radius:var(--rs);border:none;background:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.nav-tab:hover{color:var(--text);background:var(--surface2)}
.nav-tab.active{color:var(--gold);background:var(--gold-dim)}
.user-area{display:flex;align-items:center;gap:10px}
.user-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--border2)}
.user-name{font-size:12px;color:var(--text3);max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout-btn{background:none;border:1px solid var(--border2);color:var(--text3);padding:5px 12px;border-radius:var(--rs);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.logout-btn:hover{border-color:var(--red-border);color:var(--red)}
.content{flex:1;overflow:hidden;display:flex}
.page{display:none;width:100%;overflow-y:auto}
.page.active{display:flex;flex-direction:column}

/* SIDEBAR */
.mes-layout{display:grid;grid-template-columns:200px 1fr;height:100%;overflow:hidden}
.mes-sidebar{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:16px 0}
.sidebar-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);padding:0 16px 10px}
.mes-item{padding:9px 16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);transition:all .15s;display:flex;align-items:center;justify-content:space-between;border-left:2px solid transparent}
.mes-item:hover{color:var(--text);background:var(--surface2)}
.mes-item.active{color:var(--gold);background:var(--gold-dim);border-left-color:var(--gold)}
.mes-item-dot{width:6px;height:6px;border-radius:50%;background:var(--green);opacity:0;flex-shrink:0}
.mes-item.has-data .mes-item-dot{opacity:1}
.add-mes-btn{margin:10px 12px 0;padding:8px;background:none;border:1px dashed var(--border2);border-radius:var(--rs);color:var(--text3);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;width:calc(100% - 24px);transition:all .15s}
.add-mes-btn:hover{border-color:var(--gold);color:var(--gold)}

/* MES CONTENT */
.mes-content{overflow-y:auto;padding:28px}
.mes-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.mes-title{font-family:'Instrument Serif',serif;font-size:28px;color:var(--text);letter-spacing:-.3px}

/* STATS GRID - 5 cards */
.mes-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:28px}
@media(max-width:900px){.mes-stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.mes-stats{grid-template-columns:repeat(2,1fr)}.mes-layout{grid-template-columns:1fr}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:6px}
.stat-value{font-size:20px;font-weight:600;letter-spacing:-.5px}
.stat-sub{font-size:11px;color:var(--text3);margin-top:3px}
.stat-card.alert-card{border-color:var(--red-border);background:var(--red-dim)}
.stat-card.alert-card .stat-label{color:var(--red)}

/* ALERT BANNER */
.alert-banner{background:var(--red-dim);border:1px solid var(--red-border);border-radius:var(--r);padding:14px 18px;margin-bottom:20px;font-size:13px;color:var(--red);line-height:1.6}
.alert-banner strong{color:#fca5a5;display:block;margin-bottom:4px;font-size:14px}
.alert-banner ul{padding-left:18px;margin-top:6px}
.alert-banner li{margin-bottom:3px}

.section{margin-bottom:32px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3)}
.add-btn{background:var(--surface2);border:1px solid var(--border2);color:var(--text2);padding:6px 14px;border-radius:var(--rs);font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s}
.add-btn:hover{border-color:var(--gold);color:var(--gold)}

/* INGRESO CARD */
.ingreso-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.ingreso-card:hover{border-color:var(--border2)}
.ingreso-card.pagado{border-color:var(--green-border)}
.ingreso-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.pagado-toggle{width:24px;height:24px;border-radius:50%;border:2px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:12px;font-weight:700;color:transparent}
.pagado-toggle:hover{border-color:var(--green);color:var(--green)}
.pagado-toggle.on{background:var(--green);border-color:var(--green);color:#0c0c0e}
.ingreso-info{flex:1;min-width:0}
.ingreso-cliente{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ingreso-fecha{font-size:11px;color:var(--text3);margin-top:1px}
.ingreso-total{font-size:16px;font-weight:600;color:var(--text);text-align:right;white-space:nowrap}
.ingreso-cashflow{font-size:11px;color:var(--green);text-align:right;margin-top:1px}
.ingreso-chevron{color:var(--text3);font-size:11px;transition:transform .2s;margin-left:8px;flex-shrink:0}
.ingreso-card.open .ingreso-chevron{transform:rotate(180deg)}
.bolsas-area{padding:0 16px 14px;border-top:1px solid var(--border)}
.bolsas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.bolsa-chip{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);padding:10px 12px}
.bolsa-nombre{font-size:11px;color:var(--text3);font-weight:500;margin-bottom:3px}
.bolsa-monto{font-size:15px;font-weight:600;color:var(--text)}
.bolsa-chip.cashflow{border-color:var(--green-border);background:var(--green-dim)}
.bolsa-chip.cashflow .bolsa-nombre{color:var(--green)}
.bolsa-chip.cashflow .bolsa-monto{color:var(--green)}
.bolsa-chip.personal{border-color:var(--purple-border);background:var(--purple-dim)}
.bolsa-chip.personal .bolsa-nombre{color:var(--purple)}
.bolsa-chip.personal .bolsa-monto{color:var(--purple)}
.bolsas-actions{display:flex;gap:8px;margin-top:10px}
.action-sm{background:none;border:1px solid var(--border2);color:var(--text3);padding:5px 12px;border-radius:var(--rs);font-size:11px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s}
.action-sm:hover{color:var(--text)}
.action-sm.danger:hover{border-color:var(--red-border);color:var(--red)}

/* GASTOS */
.gasto-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border:1px solid var(--border);border-radius:var(--rs);margin-bottom:8px;background:var(--surface);transition:border-color .2s}
.gasto-row.pagado-gasto{border-color:var(--green-border);opacity:.7}
.gasto-prio{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.prio-alta{background:var(--red)}.prio-media{background:var(--amber)}.prio-baja{background:var(--text3)}.prio-personal{background:var(--purple)}
.gasto-info{flex:1;min-width:0}
.gasto-desc{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gasto-fecha{font-size:11px;color:var(--text3);margin-top:1px}
.gasto-amount{font-size:14px;font-weight:600;color:var(--red);white-space:nowrap}
.gasto-row.pagado-gasto .gasto-amount{color:var(--green)}
.gasto-check-btn{width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:11px;font-weight:700;color:transparent;flex-shrink:0}
.gasto-check-btn:hover{border-color:var(--green);color:var(--green)}
.gasto-check-btn.paid{background:var(--green);border-color:var(--green);color:#0c0c0e}
.del-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px 6px;font-size:14px;line-height:1;transition:color .15s;border-radius:4px}
.del-btn:hover{color:var(--red)}

/* CASHFLOW PLAN */
.cf-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.cf-header{padding:12px 16px;background:var(--green-dim);border-bottom:1px solid var(--green-border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.cf-name{font-size:13px;font-weight:500;color:var(--green)}
.cf-header-meta{font-size:11px;color:rgba(62,207,142,.6);margin-top:2px}
.cf-badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap}
.badge-ok{background:var(--green-dim);color:var(--green);border-color:var(--green-border)}
.badge-warn{background:var(--amber-dim);color:var(--amber);border-color:var(--amber-border)}
.badge-pending{background:var(--blue-dim);color:var(--blue);border-color:var(--blue-border)}
.cf-alloc{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px}
.cf-alloc:last-child{border-bottom:none}
.cf-alloc-name{color:var(--text2)}
.cf-alloc-date{font-size:11px;color:var(--text3);margin-top:1px}
.cf-alloc-amt{font-weight:500;color:var(--red);white-space:nowrap}
.cf-reserved{padding:10px 16px;display:flex;justify-content:space-between;font-size:12px;color:var(--green);background:var(--green-dim);border-top:1px solid var(--green-border)}
.cf-leftover{padding:10px 16px;display:flex;justify-content:space-between;font-size:12px;color:var(--amber);background:var(--amber-dim);border-top:1px solid var(--amber-border)}
.no-cf{text-align:center;padding:32px;color:var(--text3);font-size:13px;border:1px dashed var(--border2);border-radius:var(--r)}
.cf-summary-box{background:var(--amber-dim);border:1px solid var(--amber-border);border-radius:var(--r);padding:16px;margin-top:16px}
.cf-summary-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--amber);margin-bottom:10px}
.cf-summary-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(245,166,35,.15)}
.cf-summary-row:last-child{border-bottom:none}
.cf-summary-label{color:var(--text2)}
.cf-summary-amt{font-weight:600;color:var(--amber)}

/* ANUAL */
.anual-content{padding:28px;overflow-y:auto}
.anual-title{font-family:'Instrument Serif',serif;font-size:28px;color:var(--text);letter-spacing:-.3px;margin-bottom:4px}
.anual-year{font-size:13px;color:var(--text3);margin-bottom:24px}
.anual-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:28px}
@media(max-width:600px){.anual-stats{grid-template-columns:1fr}}
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:28px}
.chart-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:16px}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-wrap{width:100%;display:flex;flex-direction:column;justify-content:flex-end;flex:1}
.bar{width:100%;border-radius:3px 3px 0 0;min-height:3px}
.bar-facturado{background:var(--blue-dim);border:1px solid var(--blue-border)}
.bar-label{font-size:9px;color:var(--text3);text-align:center;white-space:nowrap}
.anual-table{width:100%;border-collapse:collapse;font-size:13px}
.anual-table th{text-align:left;padding:10px 12px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);border-bottom:1px solid var(--border)}
.anual-table td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.anual-table tr:last-child td{border-bottom:none}
.anual-table tr:hover td{background:var(--surface2)}
.mes-link{color:var(--text);font-weight:500;cursor:pointer;transition:color .15s}
.mes-link:hover{color:var(--gold)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:500;opacity:0;pointer-events:none;transition:opacity .2s;padding:20px}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;transform:translateY(8px);transition:transform .2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-title{font-family:'Instrument Serif',serif;font-size:22px;color:var(--text);margin-bottom:20px;letter-spacing:-.2px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-btn{flex:1;padding:10px;border-radius:var(--rs);border:1px solid;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.modal-btn-primary{background:var(--gold);border-color:var(--gold);color:#0c0c0e}
.modal-btn-primary:hover{opacity:.88}
.modal-btn-ghost{background:transparent;border-color:var(--border2);color:var(--text2)}
.modal-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;outline:none;transition:border-color .2s}
.modal-input:focus{border-color:var(--gold)}
.modal-select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;outline:none}
.bolsa-editor-row{display:grid;grid-template-columns:1fr 100px auto auto;gap:8px;align-items:center;margin-bottom:8px}
.bolsa-editor-row input{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 10px;outline:none;width:100%}
.bolsa-editor-row input:focus{border-color:var(--gold)}
.bolsa-type-select{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;padding:7px 8px;outline:none;width:100%}
.rem-bolsa{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px 6px;font-size:16px;line-height:1;transition:color .15s;border-radius:4px}
.rem-bolsa:hover{color:var(--red)}
.add-bolsa-btn{background:none;border:1px dashed var(--border2);border-radius:var(--rs);color:var(--text3);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;padding:8px;width:100%;margin-top:4px;transition:all .15s}
.add-bolsa-btn:hover{border-color:var(--gold);color:var(--gold)}


/* DEUDAS */
.deudas-content{padding:28px;overflow-y:auto}
.deudas-title{font-family:'Instrument Serif',serif;font-size:28px;color:var(--text);letter-spacing:-.3px;margin-bottom:4px}
.deudas-sub{font-size:13px;color:var(--text3);margin-bottom:24px}
.deudas-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.deuda-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:28px}
.deuda-table{width:100%;border-collapse:collapse;font-size:13px}
.deuda-table th{text-align:left;padding:10px 14px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap}
.deuda-table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.deuda-table tr:last-child td{border-bottom:none}
.deuda-table tr:hover td{background:var(--surface2)}
.deuda-concepto{font-weight:500;color:var(--text);cursor:pointer;transition:color .15s}
.deuda-concepto:hover{color:var(--gold)}
.deuda-actions{display:flex;gap:6px;align-items:center}
.liquidar-btn{background:var(--green-dim);border:1px solid var(--green-border);color:var(--green);padding:4px 10px;border-radius:var(--rs);font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;transition:all .15s}
.liquidar-btn:hover{opacity:.8}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--border)}
.pagadas-section{opacity:.6}
.prog-bar-wrap{width:80px;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.prog-bar{height:100%;border-radius:3px;background:var(--green)}
/* DEUDA DETAIL MODAL */
.mensualidades-list{margin-top:8px;max-height:320px;overflow-y:auto}
.mens-row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--rs);border:1px solid var(--border);margin-bottom:6px;background:var(--surface2);transition:border-color .2s}
.mens-row.paid{border-color:var(--green-border);background:var(--green-dim)}
.mens-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;color:transparent;transition:all .2s}
.mens-check:hover{border-color:var(--green);color:var(--green)}
.mens-check.on{background:var(--green);border-color:var(--green);color:#0c0c0e}
.mens-label{flex:1;font-size:13px;font-weight:500}
.mens-amount{font-size:13px;color:var(--text2)}
.mens-status{font-size:11px;color:var(--green);font-weight:500}


/* DRAG REORDER */
.mes-item{cursor:grab}
.mes-item.dragging{opacity:.4;cursor:grabbing}
.mes-item.drag-over{border-left-color:var(--gold);background:var(--gold-dim)}

/* AHORROS */
.ahorros-content{padding:28px;overflow-y:auto}
.ahorros-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:20px}
.ahorro-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .2s;cursor:pointer}
.ahorro-card:hover{border-color:var(--border2)}
.ahorro-card-body{padding:18px}
.ahorro-concepto{font-size:15px;font-weight:600;margin-bottom:2px}
.ahorro-banco{font-size:11px;color:var(--text3);margin-bottom:14px}
.ahorro-prog-wrap{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-bottom:8px}
.ahorro-prog-bar{height:100%;border-radius:3px;background:var(--green);transition:width .4s}
.ahorro-nums{display:flex;justify-content:space-between;font-size:12px;color:var(--text2)}
.ahorro-ahorrado{font-size:22px;font-weight:600;color:var(--green);margin-top:10px}
.ahorro-meta{font-size:12px;color:var(--text3)}
.ahorro-pct{font-size:13px;font-weight:600;color:var(--amber);margin-top:4px}
.ahorro-card-footer{padding:10px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.aport-row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--rs);border:1px solid var(--border);margin-bottom:6px;background:var(--surface2);font-size:13px}
.aport-fecha{color:var(--text3);font-size:11px;min-width:80px}
.aport-monto{font-weight:600;color:var(--green);margin-left:auto}
.aport-del{background:none;border:none;color:var(--text3);cursor:pointer;padding:2px 6px;font-size:13px;transition:color .15s;border-radius:4px}
.aport-del:hover{color:var(--red)}


/* VIAJES */
.viajes-content{padding:28px;overflow-y:auto}
.viajes-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.viaje-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden;transition:border-color .2s}
.viaje-card:hover{border-color:var(--border2)}
.viaje-card-header{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
.viaje-icon{font-size:24px;flex-shrink:0}
.viaje-info{flex:1;min-width:0}
.viaje-nombre{font-size:15px;font-weight:600}
.viaje-meta{font-size:12px;color:var(--text3);margin-top:2px}
.viaje-totals{text-align:right;flex-shrink:0}
.viaje-total-mxn{font-size:16px;font-weight:600;color:var(--text)}
.viaje-total-usd{font-size:12px;color:var(--text3);margin-top:1px}
.viaje-chevron{color:var(--text3);font-size:11px;transition:transform .2s;margin-left:8px;flex-shrink:0}
.viaje-card.open .viaje-chevron{transform:rotate(180deg)}
.viaje-body{border-top:1px solid var(--border);padding:16px 18px;display:none}

/* gasto viaje row */
.vgasto-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--rs);margin-bottom:8px;background:var(--surface2);font-size:13px}
.vgasto-info{flex:1;min-width:0}
.vgasto-obj{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vgasto-meta{font-size:11px;color:var(--text3);margin-top:2px}
.vgasto-amounts{text-align:right;flex-shrink:0}
.vgasto-mxn{font-weight:600;color:var(--red)}
.vgasto-usd{font-size:11px;color:var(--text3)}
.mp-tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--blue-dim);color:var(--blue);border:1px solid var(--blue-border);white-space:nowrap}

/* viaje stats */
.viaje-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
@media(max-width:500px){.viaje-stats{grid-template-columns:1fr 1fr}}

/* metodos de pago config */
.mp-config{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);padding:12px 16px;margin-bottom:20px}
.mp-config-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:10px}
.mp-chips{display:flex;flex-wrap:wrap;gap:6px}
.mp-chip{display:flex;align-items:center;gap:6px;background:var(--surface3);border:1px solid var(--border2);border-radius:20px;padding:4px 12px;font-size:12px}
.mp-chip-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;line-height:1;padding:0;transition:color .15s}
.mp-chip-del:hover{color:var(--red)}
.mp-add-row{display:flex;gap:8px;margin-top:8px}
.mp-add-input{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 12px;outline:none}
.mp-add-input:focus{border-color:var(--gold)}
.mp-add-btn{background:var(--surface3);border:1px solid var(--border2);color:var(--text2);padding:7px 14px;border-radius:var(--rs);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;transition:all .15s}
.mp-add-btn:hover{border-color:var(--gold);color:var(--gold)}


/* PROFIT DISTRIBUTOR */
.dist-row{display:grid;grid-template-columns:1fr 140px auto;gap:8px;align-items:center;margin-bottom:8px}
.dist-row input{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 10px;outline:none;width:100%}
.dist-row input:focus{border-color:var(--gold)}
.dist-remaining{background:var(--surface2);border-radius:var(--rs);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:13px}
.dist-remaining-label{color:var(--text2)}
.dist-remaining-val{font-size:18px;font-weight:600}
.dist-item-saved{background:var(--green-dim);border:1px solid var(--green-border);border-radius:var(--rs);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px}
.dist-item-label{color:var(--text);font-weight:500}
.dist-item-amount{color:var(--green);font-weight:600}


/* CALENDAR MODAL */
.cal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:600;opacity:0;pointer-events:none;transition:opacity .2s;padding:16px}
.cal-overlay.open{opacity:1;pointer-events:all}
.cal-box{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);width:100%;max-width:900px;max-height:94vh;overflow:hidden;display:flex;flex-direction:column;transform:translateY(10px);transition:transform .2s}
.cal-overlay.open .cal-box{transform:translateY(0)}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.cal-title{font-family:'Instrument Serif',serif;font-size:20px;color:var(--gold);letter-spacing:-.2px}
.cal-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1;transition:color .15s}
.cal-close:hover{color:var(--text)}
.cal-body{overflow-y:auto;padding:20px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-day-label{text-align:center;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);padding:6px 0}
.cal-cell{min-height:100px;border-radius:8px;padding:7px;border:1px solid var(--border);background:var(--surface2);position:relative;transition:border-color .15s;cursor:default;overflow:hidden}
.cal-cell.today{border-color:var(--gold);background:var(--gold-dim)}
.cal-cell.other-month{opacity:.3}
.cal-cell.has-events{border-color:var(--border2)}
.cal-day-num{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:5px;display:flex;align-items:center;justify-content:space-between}
.cal-cell.today .cal-day-num{color:var(--gold)}
.today-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0}
.cal-event{font-size:10px;font-weight:500;padding:3px 6px;border-radius:5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;display:flex;align-items:center;gap:4px}
.cal-event.ingreso{background:var(--green-dim);color:var(--green);border:1px solid var(--green-border)}
.cal-event.gasto{background:var(--red-dim);color:var(--red);border:1px solid var(--red-border)}
.cal-event.gasto-pagado{background:rgba(62,207,142,.1);color:var(--green);border:1px solid var(--green-border)}
.cal-event.gasto.personal{background:var(--purple-dim);color:var(--purple);border:1px solid var(--purple-border)}
.cal-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.cal-legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.cal-legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* UTILS */
.divider{border:none;border-top:1px solid var(--border);margin:24px 0}
.empty{text-align:center;padding:28px;color:var(--text3);font-size:13px;border:1px dashed var(--border2);border-radius:var(--r)}
.spinner{display:block;width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">Cashflow</div>
    <div class="auth-sub">Gestión inteligente de flujo de caja</div>
    <button class="google-btn" onclick="loginGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continuar con Google
    </button>
    <div class="auth-divider">o usa tu correo</div>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="showAuthTab('login')">Iniciar sesión</div>
      <div class="auth-tab" onclick="showAuthTab('registro')">Crear cuenta</div>
    </div>
    <div class="auth-form active" id="form-login">
      <div class="f-row"><label>Correo</label><input type="email" id="l-email" placeholder="tu@correo.com"></div>
      <div class="f-row"><label>Contraseña</label><input type="password" id="l-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"></div>
      <button class="auth-btn" onclick="login()">Entrar</button>
      <div class="auth-error" id="login-err"></div>
    </div>
    <div class="auth-form" id="form-registro">
      <div class="f-row"><label>Correo</label><input type="email" id="r-email" placeholder="tu@correo.com"></div>
      <div class="f-row"><label>Contraseña</label><input type="password" id="r-pass" placeholder="Mínimo 6 caracteres" onkeydown="if(event.key==='Enter')registro()"></div>
      <button class="auth-btn" onclick="registro()">Crear cuenta</button>
      <div class="auth-error" id="reg-err"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;flex-direction:column;height:100vh">
  <div class="topbar">
    <div class="topbar-left">
      <div class="brand">Cashflow</div>
      <div class="nav-tabs">
        <button class="nav-tab active" onclick="showPage('mes',this)">Mes</button>
        <button class="nav-tab" onclick="showPage('anual',this)">Año</button>
        <button class="nav-tab" onclick="showPage('deudas',this)">Deudas</button>
        <button class="nav-tab" onclick="showPage('ahorros',this)">Ahorros</button>
        <button class="nav-tab" onclick="showPage('viajes',this)">Viajes</button>
      </div>
    </div>
    <div class="user-area">
      <img id="user-avatar" class="user-avatar" src="" style="display:none">
      <span id="user-name" class="user-name"></span>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="content">
    <div class="page active" id="page-mes">
      <div class="mes-layout">
        <div class="mes-sidebar">
          <div class="sidebar-title">Meses</div>
          <div id="mes-list"></div>
          <button class="add-mes-btn" onclick="openNuevoMes()">＋ Nuevo mes</button>
        </div>
        <div class="mes-content" id="mes-content">
          <div class="empty" style="margin-top:60px">Selecciona o crea un mes para comenzar.</div>
        </div>
      </div>
    </div>
    <div class="page" id="page-anual">
      <div class="anual-content" id="anual-content"><div class="spinner"></div></div>
    </div>
    <div class="page" id="page-deudas">
      <div class="deudas-content" id="deudas-content"><div class="spinner"></div></div>
    </div>
    <div class="page" id="page-ahorros">
      <div class="ahorros-content" id="ahorros-content"><div class="spinner"></div></div>
    </div>
    <div class="page" id="page-viajes">
      <div class="viajes-content" id="viajes-content"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box"></div>
</div>

<div class="cal-overlay" id="cal-overlay">
  <div class="cal-box">
    <div class="cal-header">
      <div class="cal-title" id="cal-title">Calendario</div>
      <button class="cal-close" onclick="closeCalendario()">✕</button>
    </div>
    <div class="cal-body" id="cal-body"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, collection, getDocs, setDoc, deleteDoc, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const fbApp = initializeApp({
  apiKey:"AIzaSyD8JS-8fwIGWzX29bOVHc-yse3qt70X2cM",
  authDomain:"cashflow-a7fcc.firebaseapp.com",
  projectId:"cashflow-a7fcc",
  storageBucket:"cashflow-a7fcc.firebasestorage.app",
  messagingSenderId:"280921673419",
  appId:"1:280921673419:web:06b196662bafa52620d54e"
});
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const gProvider = new GoogleAuthProvider();

let uid=null, meses=[], activeMesId=null, mesData={};

// ── AUTH ──
window.showAuthTab = t => {
  document.querySelectorAll('.auth-tab').forEach((el,i)=>el.classList.toggle('active',(i===0&&t==='login')||(i===1&&t==='registro')));
  document.getElementById('form-login').classList.toggle('active',t==='login');
  document.getElementById('form-registro').classList.toggle('active',t==='registro');
};
window.loginGoogle = async()=>{ try{await signInWithPopup(auth,gProvider);}catch(e){document.getElementById('login-err').textContent=tradErr(e.code);} };
window.login = async()=>{
  const e=document.getElementById('l-email').value.trim(),p=document.getElementById('l-pass').value;
  document.getElementById('login-err').textContent='';
  try{await signInWithEmailAndPassword(auth,e,p);}catch(e){document.getElementById('login-err').textContent=tradErr(e.code);}
};
window.registro = async()=>{
  const e=document.getElementById('r-email').value.trim(),p=document.getElementById('r-pass').value;
  document.getElementById('reg-err').textContent='';
  try{await createUserWithEmailAndPassword(auth,e,p);}catch(e){document.getElementById('reg-err').textContent=tradErr(e.code);}
};
window.logout=()=>signOut(auth);
function tradErr(c){return({'auth/invalid-email':'Correo inválido','auth/user-not-found':'No existe esa cuenta','auth/wrong-password':'Contraseña incorrecta','auth/invalid-credential':'Correo o contraseña incorrectos','auth/email-already-in-use':'Ese correo ya está registrado','auth/weak-password':'Mínimo 6 caracteres','auth/popup-closed-by-user':'Cerraste la ventana de Google'}[c]||'Error: '+c);}

onAuthStateChanged(auth, async user=>{
  if(user){
    uid=user.uid;
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    const av=document.getElementById('user-avatar');
    if(user.photoURL){av.src=user.photoURL;av.style.display='block';}
    document.getElementById('user-name').textContent=user.displayName||user.email;
    await loadMeses();
  } else {
    uid=null;
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('app').style.display='none';
  }
});

// ── NAV ──
window.showPage=(page,btn)=>{
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  btn.classList.add('active');
  if(page==='anual') renderAnual();
  if(page==='deudas') renderDeudas();
  if(page==='ahorros') renderAhorros();
  if(page==='viajes') renderViajes();
};

// ── MESES ──
async function loadMeses(){
  const snap=await getDocs(collection(db,'users',uid,'meses'));
  meses=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.orden-b.orden);
  renderSidebar();
  if(meses.length) selectMes(meses[meses.length-1].id);
}

function renderSidebar(){
  const list=document.getElementById('mes-list');
  if(!meses.length){list.innerHTML='<div style="padding:12px 16px;font-size:12px;color:var(--text3)">Sin meses aún</div>';return;}
  list.innerHTML=meses.map(m=>{
    const d=mesData[m.id],hasData=d&&(d.ingresos.length||d.gastos.length);
    return `<div class="mes-item ${m.id===activeMesId?'active':''} ${hasData?'has-data':''}" draggable="true" data-id="${m.id}" onclick="selectMes('${m.id}')">
      <span style="display:flex;align-items:center;gap:8px"><span style="color:var(--text3);font-size:10px;cursor:grab">⠿</span>${m.nombre}</span>
      <span class="mes-item-dot"></span>
    </div>`;
  }).join('');
  // drag-to-reorder
  let dragSrc=null;
  list.querySelectorAll('.mes-item').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragSrc=el;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    el.addEventListener('dragend',()=>{list.querySelectorAll('.mes-item').forEach(x=>x.classList.remove('dragging','drag-over'));});
    el.addEventListener('dragover',e=>{e.preventDefault();if(el!==dragSrc){list.querySelectorAll('.mes-item').forEach(x=>x.classList.remove('drag-over'));el.classList.add('drag-over');}});
    el.addEventListener('drop',async e=>{
      e.preventDefault();
      if(!dragSrc||dragSrc===el) return;
      const ids=[...list.querySelectorAll('.mes-item')].map(x=>x.dataset.id);
      const fromIdx=ids.indexOf(dragSrc.dataset.id), toIdx=ids.indexOf(el.dataset.id);
      meses.splice(toIdx,0,meses.splice(fromIdx,1)[0]);
      // persist new order
      const batch=meses.map((m,i)=>updateDoc(doc(db,'users',uid,'meses',m.id),{orden:i}));
      await Promise.all(batch);
      renderSidebar();
    });
  });
}

window.selectMes=async id=>{
  activeMesId=id; renderSidebar();
  if(!mesData[id]) await loadMesData(id);
  renderMes();
};

async function loadMesData(id){
  const [iS,gS]=await Promise.all([
    getDocs(collection(db,'users',uid,'meses',id,'ingresos')),
    getDocs(collection(db,'users',uid,'meses',id,'gastos'))
  ]);
  const mesDoc = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js').then(m=>m.getDoc(doc(db,'users',uid,'meses',id))).catch(()=>null);
  const distribucion = mesDoc?.data()?.distribucion || [];
  mesData[id]={
    ingresos:iS.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')),
    gastos:gS.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')),
    distribucion
  };
}

window.openNuevoMes=()=>{
  const M=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],now=new Date();
  const y=now.getFullYear();const opts=M.map((nombre,i)=>`<option value="${nombre} ${y}" ${i===now.getMonth()?'selected':''}>${nombre} ${y}</option>`).join('')+M.map((nombre,i)=>`<option value="${nombre} ${y+1}">${nombre} ${y+1}</option>`).join('');
  showModal(`<div class="modal-title">Nuevo mes</div>
    <div class="f-row"><label>Mes</label><select id="nm-sel" class="modal-select">${opts}</select></div>
    <div class="f-row"><label>O nombre personalizado</label><input id="nm-custom" class="modal-input" placeholder="Ej: Q2 2025, Freelance..."></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-primary" onclick="crearMes()">Crear</button>
      <button class="modal-btn modal-btn-ghost" onclick="closeModal()">Cancelar</button>

window.crearMes=async()=>{
  const nombre=(document.getElementById('nm-custom').value.trim())||document.getElementById('nm-sel').value;
  const id=Date.now().toString();
  await setDoc(doc(db,'users',uid,'meses',id),{nombre,orden:Date.now()});
  meses.push({id,nombre,orden:Date.now()}); mesData[id]={ingresos:[],gastos:[]};
  closeModal(); renderSidebar(); selectMes(id);
};

// ── HELPERS ──
function cfDeIngreso(ing){ const b=(ing.bolsas||[]).find(b=>b.tipo==='cashflow'||b.esCashflow); return b?b.monto:0; }
function personalDeIngreso(ing){ return (ing.bolsas||[]).filter(b=>b.tipo==='personal').reduce((s,b)=>s+b.monto,0); }

// ── RENDER MES ──
function renderMes(){
  const mes=meses.find(m=>m.id===activeMesId), data=mesData[activeMesId];
  if(!mes||!data) return;

  const totalFact = data.ingresos.reduce((s,i)=>s+(i.total||0),0);
  const totalCob  = data.ingresos.filter(i=>i.pagado).reduce((s,i)=>s+(i.total||0),0);

  // CF cobrado (real)
  const cfCobrado = data.ingresos.filter(i=>i.pagado).reduce((s,i)=>s+cfDeIngreso(i),0);
  // CF proyectado (todos, incluyendo no cobrados)
  const cfTotal   = data.ingresos.reduce((s,i)=>s+cfDeIngreso(i),0);
  // Gasto personal (de bolsas tipo personal)
  const totalPersonal = data.ingresos.reduce((s,i)=>s+personalDeIngreso(i),0);

  const totalGas  = data.gastos.reduce((s,g)=>s+(g.monto||0),0);
  const gastosPagados = data.gastos.filter(g=>g.pagado).reduce((s,g)=>s+(g.monto||0),0);

  // Profit = lo que sobra del CF cobrado después de gastos
  const profit = cfTotal - totalGas;

  // Alerta: usa TODO el CF (cobrado + por cobrar). Los pendientes son seguros.
  // Solo alerta si para la fecha de un gasto la caja acumulada no alcanza.
  const gastosNoCubiertos = [];
  {
    const eventos = [];
    data.ingresos.forEach(i=>{ const cf=cfDeIngreso(i); if(cf>0) eventos.push({fecha:i.fecha||'',delta:cf,tipo:'ingreso'}); });
    data.gastos.filter(g=>!g.pagado&&g.prioridad!=='personal').forEach(g=>eventos.push({fecha:g.fecha||'',delta:-g.monto,tipo:'gasto',gasto:g}));
    eventos.sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.tipo==='ingreso'?-1:1));
    let caja = 0;
    for(const ev of eventos){
      caja += ev.delta;
      if(ev.tipo==='gasto' && caja < 0){
        gastosNoCubiertos.push({...ev.gasto, faltante: Math.abs(caja)});
        caja = 0;
      }
    }
  }

  let alertHTML = '';
  if(gastosNoCubiertos.length > 0){
    const items = gastosNoCubiertos.map(g=>`<li><strong>${g.descripcion}</strong> — ${fmt(g.monto)} · fecha: ${fmtDate(g.fecha)} · faltan ${fmt(g.faltante)}</li>`).join('');
    alertHTML=`<div class="alert-banner"><strong>⚠️ Alerta de caja</strong>No habrá suficiente dinero para cubrir estos gastos a tiempo:<ul>${items}</ul></div>`;
  }

  document.getElementById('mes-content').innerHTML=`
    <div class="mes-header">
      <div class="mes-title">${mes.nombre}</div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="action-sm" onclick="openCalendario('${mes.id}')" style="border-color:var(--gold);color:var(--gold)">📅 Calendario</button>
        <button class="action-sm danger" onclick="eliminarMes()">Eliminar mes</button>
      </div>
    </div>
    ${alertHTML}
    <div class="mes-stats">
      <div class="stat-card"><div class="stat-label">Facturado</div><div class="stat-value">${fmt(totalFact)}</div><div class="stat-sub">${data.ingresos.length} ingreso(s)</div></div>
      <div class="stat-card"><div class="stat-label">Cobrado</div><div class="stat-value" style="color:var(--green)">${fmt(totalCob)}</div><div class="stat-sub">${data.ingresos.filter(i=>i.pagado).length} pagado(s)</div></div>
      <div class="stat-card"><div class="stat-label">Gastos del mes</div><div class="stat-value" style="color:var(--red)">${fmt(totalGas)}</div><div class="stat-sub">Pagados: ${fmt(gastosPagados)}</div></div>
      <div class="stat-card"><div class="stat-label">Gasto personal</div><div class="stat-value" style="color:var(--purple)">${fmt(totalPersonal)}</div><div class="stat-sub">De bolsas personales</div></div>
      <div class="stat-card ${profit<0?'alert-card':''}" style="cursor:${profit>0?'pointer':'default'}" onclick="${profit>0?`openDistribuirProfit(${profit})`:''}" title="${profit>0?'Click para distribuir':''}"><div class="stat-label">El Profit ✦ ${profit>0?'<span style=\"font-size:9px;opacity:.7\">(click para distribuir)</span>':''}</div><div class="stat-value" style="color:${profit>=0?'var(--amber)':'var(--red)'}">${fmt(Math.abs(profit))}</div><div class="stat-sub">${profit>=0?'Estimado del mes':'Faltante estimado'} · CF: ${fmt(cfTotal)} − Gastos: ${fmt(totalGas)}</div>
        ${(data.distribucion||[]).length?`<div style="margin-top:8px;border-top:1px solid rgba(245,166,35,.2);padding-top:8px">${(data.distribucion||[]).map(d=>`<div style="display:flex;justify-content:space-between;font-size:11px;margin-top:4px"><span style="color:var(--text2)">${d.concepto}</span><span style="color:var(--amber);font-weight:600">${fmt(d.monto)}</span></div>`).join('')}</div>`:''}</div>
    </div>
    <div class="section">
      <div class="section-header"><div class="section-title">Ingresos</div><button class="add-btn" onclick="openNuevoIngreso()">+ Agregar</button></div>
      ${data.ingresos.length?data.ingresos.map(renderIngresoCard).join(''):'<div class="empty">Sin ingresos. Agrega el primero.</div>'}
    </div>
    <div class="divider"></div>
    <div class="section">
      <div class="section-header"><div class="section-title">Gastos del mes</div><button class="add-btn" onclick="openNuevoGasto()">+ Agregar</button></div>
      ${(()=>{
        if(!data.gastos.length) return '<div class="empty">Sin gastos registrados.</div>';
        // Calcular qué ingreso cubre cada gasto (mismo algoritmo que el plan)
        const cfIngs=data.ingresos.filter(i=>cfDeIngreso(i)>0);
        let incW=cfIngs.map(i=>({...i,rem:cfDeIngreso(i)}));
        const coberturaMap={};
        const gastosOrd=[...data.gastos].filter(g=>g.prioridad!=='personal').sort((a,b)=>{
          const p={alta:0,media:1,baja:2};
          if(a.fecha!==b.fecha) return (a.fecha||'').localeCompare(b.fecha||'');
          return (p[a.prioridad]||1)-(p[b.prioridad]||1);
        });
        for(const exp of gastosOrd){
          let cands=incW.filter(i=>i.rem>0&&(i.fecha||'')<=(exp.fecha||''));
          if(!cands.length) cands=incW.filter(i=>i.rem>0).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
          else cands.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
          const single=cands.find(i=>i.rem>=exp.monto);
          if(single){single.rem-=exp.monto;coberturaMap[exp.id]=single.cliente;}
          else if(cands.length){coberturaMap[exp.id]=cands[0].cliente+(cands.length>1?'+':' (parcial)');}
        }
        return data.gastos.map(g=>renderGastoRow(g, coberturaMap[g.id])).join('');
      })()}
      ${data.gastos.length?`<div style="font-size:12px;color:var(--text3);margin-top:10px">Pagados: ${fmt(gastosPagados)} · Pendientes: ${fmt(totalGas-gastosPagados)}</div>`:''}
    </div>
    <div class="divider"></div>
    <div class="section">
      <div class="section-title" style="margin-bottom:14px">Plan de cashflow</div>
      ${renderCashflowPlan(data)}
    </div>`;
}

// ── CASHFLOW PLAN ──
function renderCashflowPlan(data){
  // Incluye TODOS los ingresos con CF (cobrados y no cobrados)
  const cfIngresos=data.ingresos.filter(i=>cfDeIngreso(i)>0);
  if(!cfIngresos.length) return '<div class="no-cf">Define bolsas de cashflow en tus ingresos para ver el plan.</div>';

  const gastos=[...data.gastos].filter(g=>g.prioridad!=='personal').sort((a,b)=>{
    const p={alta:0,media:1,baja:2};
    if(a.fecha!==b.fecha) return (a.fecha||'').localeCompare(b.fecha||'');
    return (p[a.prioridad]||1)-(p[b.prioridad]||1);
  });

  let incW=cfIngresos.map(i=>({...i,cfAmount:cfDeIngreso(i),remaining:cfDeIngreso(i),allocations:[]}));
  let expW=gastos.map(e=>({...e,covered:false,uncovered:0}));

  for(let exp of expW){
    // Primero candidatos con fecha anterior o igual (cobrados o no)
    let cands=incW.filter(i=>i.remaining>0&&(i.fecha||'')<=(exp.fecha||''));
    if(!cands.length) cands=incW.filter(i=>i.remaining>0).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
    else cands.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
    // Preferir uno solo que cubra completo
    const single=cands.find(i=>i.remaining>=exp.monto);
    if(single){
      single.remaining-=exp.monto;
      single.allocations.push({desc:exp.descripcion,fecha:exp.fecha,amount:exp.monto,prioridad:exp.prioridad,gastoPagado:exp.pagado});
      exp.covered=true;
    } else {
      let rem=exp.monto;
      for(let inc of cands){if(rem<=0)break;const take=Math.min(inc.remaining,rem);inc.remaining-=take;rem-=take;inc.allocations.push({desc:exp.descripcion,fecha:exp.fecha,amount:take,prioridad:exp.prioridad,gastoPagado:exp.pagado});}
      if(rem<=0)exp.covered=true;else exp.uncovered=rem;
    }
  }

  const totalSobrante=incW.reduce((s,i)=>s+i.remaining,0);
  const uncovered=expW.filter(e=>!e.covered);

  let html=incW.map(inc=>{
    const reserved=inc.cfAmount-inc.remaining;
    const isPending=!inc.pagado;
    const badge=isPending
      ? `<span class="cf-badge badge-pending">Pendiente de cobro</span>`
      : inc.remaining>0?`<span class="cf-badge badge-ok">Sobra ${fmt(inc.remaining)}</span>`:`<span class="cf-badge badge-warn">Sin sobrante</span>`;
    let h=`<div class="cf-card" style="${isPending?'opacity:.85':''}">
      <div class="cf-header">
        <div>
          <div class="cf-name">💰 ${inc.cliente}${isPending?' <span style="font-size:11px;color:var(--blue)">· No cobrado aún</span>':''}</div>
          <div class="cf-header-meta">CF: ${fmt(inc.cfAmount)} · ${isPending?'Esperado':'Cobrado'} el ${fmtDate(inc.fecha)}</div>
        </div>
        ${badge}
      </div>`;
    if(!inc.allocations.length) h+=`<div class="cf-alloc"><span style="color:var(--text3)">Sin gastos asignados.</span></div>`;
    else inc.allocations.forEach(a=>{
      const pc=a.prioridad==='alta'?'var(--red)':a.prioridad==='media'?'var(--amber)':'var(--text3)';
      h+=`<div class="cf-alloc ${a.gastoPagado?'':''}">
        <div>
          <div class="cf-alloc-name">${a.gastoPagado?'✓ ':''}${a.desc}${a.gastoPagado?' <span style="font-size:10px;color:var(--green)">pagado</span>':''}</div>
          <div class="cf-alloc-date">Fecha: ${fmtDate(a.fecha)} · <span style="color:${pc}">${a.prioridad||'media'}</span></div>
        </div>
        <div class="cf-alloc-amt" style="${a.gastoPagado?'color:var(--green)':''}">−${fmt(a.amount)}</div>
      </div>`;
    });
    if(reserved>0) h+=`<div class="cf-reserved"><span>Reservado para gastos</span><span>${fmt(reserved)}</span></div>`;
    if(inc.remaining>0) h+=`<div class="cf-leftover"><span>✦ Sobrante libre</span><span>${fmt(inc.remaining)}</span></div>`;
    h+=`</div>`; return h;
  }).join('');

  if(uncovered.length) html+=`<div style="background:var(--red-dim);border:1px solid var(--red-border);border-radius:var(--rs);padding:12px 16px;font-size:13px;color:var(--red);margin-top:12px">❌ Sin cobertura: ${uncovered.map(e=>`${e.descripcion} (faltan ${fmt(e.uncovered||e.monto)})`).join(', ')}</div>`;
  if(totalSobrante>0) html+=`<div class="cf-summary-box">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <div class="cf-summary-title" style="margin-bottom:0">✦ El Profit por ingreso</div>
    <button onclick="openDistribuirProfit(${totalSobrante})" style="background:var(--amber);border:none;color:#0c0c0e;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;padding:5px 14px;border-radius:var(--rs);cursor:pointer;transition:opacity .15s" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">Distribuir ✦</button>
  </div>
  ${incW.filter(i=>i.remaining>0).map(i=>`<div class="cf-summary-row"><div class="cf-summary-label">${i.cliente}${!i.pagado?' (pendiente)':''}</div><div class="cf-summary-amt">${fmt(i.remaining)}</div></div>`).join('')}
</div>`;
  return html;
}

  const bolsas=ing?.bolsas||[
    {nombre:'Nómina',monto:'',tipo:'otro'},
    {nombre:'Impuestos',monto:'',tipo:'otro'},
    {nombre:'Cashflow',monto:'',tipo:'cashflow'},
    {nombre:'Personal',monto:'',tipo:'personal'}
  ];
  const typeOpts=tipo=>`
    <option value="cashflow" ${tipo==='cashflow'||tipo===true?'selected':''}>✦ Cashflow</option>
    <option value="personal" ${tipo==='personal'?'selected':''}>♦ Personal</option>
    <option value="otro" ${(!tipo||tipo==='otro'||tipo===false)?'selected':''}>Otro</option>`;
  const bHTML=bolsas.map((b,i)=>`<div class="bolsa-editor-row" id="brow-${i}">

    <input type="number" placeholder="Monto" value="${b.monto||''}" id="bm-${i}">
    <select class="bolsa-type-select" id="bt-${i}">${typeOpts(b.tipo!==undefined?b.tipo:b.esCashflow?'cashflow':'otro')}</select>
    <button class="rem-bolsa" onclick="remBolsa(${i})">×</button></div>`).join('');
  return `<div class="modal-title">${ing?'Editar ingreso':'Nuevo ingreso'}</div>
    <div class="f-row"><label>Cliente / Fuente</label><input id="ing-cliente" class="modal-input" value="${ing?.cliente||''}" placeholder="Nombre del cliente"></div>
    <div class="f-row"><label>Monto total</label><input id="ing-total" class="modal-input" type="number" value="${ing?.total||''}" placeholder="0.00"></div>
    <div class="f-row"><label>Fecha esperada de cobro</label><input id="ing-fecha" class="modal-input" type="date" value="${ing?.fecha||today}"></div>
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin:16px 0 8px">Distribución por bolsas</div>
    <div style="display:grid;grid-template-columns:1fr 100px auto auto;gap:8px;margin-bottom:6px">
      <span style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text3)">Nombre</span>
      <span style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text3)">Monto</span>
      <span style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text3)">Tipo</span><span></span>

window.guardarIngreso=async existingId=>{
  const cliente=document.getElementById('ing-cliente').value.trim();
  const total=parseFloat(document.getElementById('ing-total').value)||0;
  const fecha=document.getElementById('ing-fecha').value;
  if(!cliente||!fecha) return alert('Completa cliente y fecha.');
  const rows=document.querySelectorAll('#bolsas-editor .bolsa-editor-row');
  const bolsas=[];
  rows.forEach((_,i)=>{
    const n=document.getElementById(`bn-${i}`)?.value?.trim();
    const m=parseFloat(document.getElementById(`bm-${i}`)?.value)||0;
    const t=document.getElementById(`bt-${i}`)?.value||'otro';
    if(n) bolsas.push({nombre:n,monto:m,tipo:t,esCashflow:t==='cashflow'});
  });
  const id=existingId||Date.now().toString();
  const existing=existingId?mesData[activeMesId].ingresos.find(i=>i.id===existingId):null;
  const obj={cliente,total,fecha,bolsas,pagado:existing?.pagado||false};
  await setDoc(doc(db,'users',uid,'meses',activeMesId,'ingresos',id),obj);
  if(existingId){const idx=mesData[activeMesId].ingresos.findIndex(i=>i.id===existingId);mesData[activeMesId].ingresos[idx]={id,...obj};}
  else{ mesData[activeMesId].ingresos.push({id,...obj}); mesData[activeMesId].ingresos.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')); }
  closeModal(); renderMes(); renderSidebar();
};

async function renderAnual(){
  const c=document.getElementById('anual-content');
  c.innerHTML='<div class="spinner"></div>';
  for(const m of meses) if(!mesData[m.id]) await loadMesData(m.id);
  const year=new Date().getFullYear();
  const totalFact=meses.reduce((s,m)=>s+(mesData[m.id]?.ingresos||[]).reduce((ss,i)=>ss+(i.total||0),0),0);
  const totalCob=meses.reduce((s,m)=>s+(mesData[m.id]?.ingresos||[]).filter(i=>i.pagado).reduce((ss,i)=>ss+(i.total||0),0),0);
  const totalCF=meses.reduce((s,m)=>s+(mesData[m.id]?.ingresos||[]).reduce((ss,i)=>ss+cfDeIngreso(i),0),0);
  const maxFact=Math.max(...meses.map(m=>(mesData[m.id]?.ingresos||[]).reduce((s,i)=>s+(i.total||0),0)),1);
  const barH = 120;
  const barW = meses.length ? Math.max(20, Math.floor(560/meses.length)-6) : 40;
  const barsData = meses.map(m=>({
    nombre: m.nombre.substring(0,3),
    f: (mesData[m.id]?.ingresos||[]).reduce((s,i)=>s+(i.total||0),0)
  }));
  const svgW = meses.length*(barW+6)+20;
  const bars = `<svg width="100%" height="${barH+28}" viewBox="0 0 ${svgW} ${barH+28}" preserveAspectRatio="xMidYMid meet" style="display:block">
    ${barsData.map((b,i)=>{
      const h = maxFact>0?Math.max(4,Math.round(b.f/maxFact*barH)):4;
      const x = 10+i*(barW+6);
      const y = barH-h;
      return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="3" fill="rgba(91,156,246,0.25)" stroke="rgba(91,156,246,0.5)" stroke-width="1">
        <title>${b.nombre}: ${fmt(b.f)}</title></rect>
        <text x="${x+barW/2}" y="${barH+16}" text-anchor="middle" font-size="9" fill="#4a4845" font-family="DM Sans,sans-serif">${b.nombre}</text>`;
    }).join('')}
  </svg>`;
  const rows=meses.length?meses.map(m=>{
    const d=mesData[m.id]||{ingresos:[],gastos:[]};
    const f=d.ingresos.reduce((s,i)=>s+(i.total||0),0);
    const cob=d.ingresos.filter(i=>i.pagado).reduce((s,i)=>s+(i.total||0),0);
    const cf=d.ingresos.reduce((s,i)=>s+cfDeIngreso(i),0);
    const gas=d.gastos.reduce((s,g)=>s+(g.monto||0),0);
    const profit=cf-gas;
    return `<tr>
      <td><span class="mes-link" onclick="goToMes('${m.id}')">${m.nombre}</span></td>
      <td style="font-weight:600">${fmt(f)}</td>
      <td style="font-weight:600;color:var(--green)">${fmt(cob)}${f-cob>0?`<br><span style="font-size:11px;color:var(--amber)">Pend: ${fmt(f-cob)}</span>`:''}</td>
      <td style="font-weight:600;color:var(--red)">${fmt(gas)}</td>
    </tr>`;
  }).join(''):'<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--text3)">Sin meses registrados</td></tr>';

  c.innerHTML=`
    <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:4px">
      <div class="anual-title">Resumen anual</div>
      <button onclick="exportarExcel()" style="background:var(--green-dim);border:1px solid var(--green-border);color:var(--green);padding:8px 18px;border-radius:var(--rs);font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:opacity .15s" onmouseover="this.style.opacity='.8'" onmouseout="this.style.opacity='1'">⬇ Exportar Excel</button>
    </div>
    <div class="anual-year">${year}</div>
    <div class="anual-stats">
      <div class="stat-card"><div class="stat-label">Total facturado</div><div class="stat-value">${fmt(totalFact)}</div><div class="stat-sub">Todos los meses</div></div>
      <div class="stat-card"><div class="stat-label">Total cobrado</div><div class="stat-value" style="color:var(--green)">${fmt(totalCob)}</div><div class="stat-sub">${totalFact>0?Math.round(totalCob/totalFact*100):0}% del facturado</div></div>
    </div>
    ${meses.length?`<div class="chart-wrap"><div class="chart-title">Facturado por mes</div><div style="overflow-x:auto">${bars}</div></div>`:''}
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
      <table class="anual-table">
        <thead><tr><th>Mes</th><th>Facturado</th><th>Cobrado</th><th>Gastos</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

let deudas = [];

async function loadDeudas(){
  const snap = await getDocs(collection(db,'users',uid,'deudas'));
  deudas = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.creadoEn||0)-(b.creadoEn||0));
}


function ahorradoDeuda(d){ return (d.aportacionesAhorro||[]).reduce((s,a)=>s+(a.monto||0),0); }

async function renderDeudas(){
  const c = document.getElementById('deudas-content');
  c.innerHTML='<div class="spinner"></div>';
  if(!deudas.length) await loadDeudas();

  const activas = deudas.filter(d=>!d.liquidada);
  const pagadas = deudas.filter(d=>d.liquidada);

  const faltante = d => Math.max(0, (d.montoRestante||0) - ahorradoDeuda(d));
  const progPct  = d => {
    const total = d.mensualidades||1;
    const pagadas = (d.pagos||[]).filter(p=>p.pagado).length;
    return Math.round(pagadas/total*100);
  };

  const theadHTML = `<tr>
    <th>Concepto</th><th>Monto total</th><th>Pago mensual</th>
    <th>Mens. rest.</th><th>Monto restante</th><th>Ahorrado</th><th>Faltante</th><th>Progreso</th><th></th>
  </tr>`;

  const rowHTML = d => {
    const mens = d.mensualidades||0;
    const pagosHechos = (d.pagos||[]).filter(p=>p.pagado).length;
    const restantes = Math.max(0, mens - pagosHechos);
    const montoRest = restantes * (d.pagoMensual||0);
    const ahorrado = ahorradoDeuda(d);
    const falt = Math.max(0, montoRest - ahorrado);
    const pct = mens>0?Math.round(pagosHechos/mens*100):0;
    return `<tr>
      <td><span class="deuda-concepto" onclick="openDeudaDetail('${d.id}')">${d.concepto}</span></td>
      <td style="font-weight:600">${fmt(d.montoTotal||0)}</td>
      <td style="color:var(--amber)">${fmt(d.pagoMensual||0)}</td>
      <td style="text-align:center">${restantes} / ${mens}</td>
      <td style="color:var(--red);font-weight:600">${fmt(montoRest)}</td>
      <td style="color:var(--green)">${fmt(ahorrado)}</td>
      <td style="color:${falt>0?'var(--red)':'var(--green)'};font-weight:600">${falt>0?fmt(falt):'✓ Cubierto'}</td>
      <td>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="prog-bar-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
          <span style="font-size:11px;color:var(--text3)">${pct}%</span>
        </div>
      </td>
      <td>
        <div class="deuda-actions">
          <button class="liquidar-btn" onclick="liquidarDeuda('${d.id}')">Liquidar</button>
          <button class="del-btn" onclick="eliminarDeuda('${d.id}')">✕</button>
        </div>
      </td>
    </tr>`;
  };

  const pagadasRowHTML = d => {
    return `<tr style="opacity:.55">
      <td><span style="font-weight:500;text-decoration:line-through;color:var(--text3)">${d.concepto}</span></td>
      <td>${fmt(d.montoTotal||0)}</td>
      <td>${fmt(d.pagoMensual||0)}</td>
      <td style="text-align:center;color:var(--green)">✓ Liquidada</td>
      <td>—</td><td>—</td><td style="color:var(--green)">✓</td>
      <td><div class="prog-bar-wrap"><div class="prog-bar" style="width:100%"></div></div></td>
      <td><button class="del-btn" onclick="eliminarDeuda('${d.id}')">✕</button></td>
    </tr>`;
  };

  c.innerHTML = `
    <div class="deudas-header">
      <div>
        <div class="deudas-title">Deudas</div>
        <div class="deudas-sub">${activas.length} deuda(s) activa(s) · Click en el concepto para ver mensualidades</div>
      </div>
      <button class="add-btn" onclick="openNuevaDeuda()">+ Nueva deuda</button>
    </div>
    ${activas.length ? `<div class="mes-stats" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px">
      <div class="stat-card">
        <div class="stat-label">Total deuda activa</div>
        <div class="stat-value" style="color:var(--red)">${fmt(activas.reduce((s,d)=>{ const r=Math.max(0,d.mensualidades-(d.pagos||[]).filter(p=>p.pagado).length); return s+r*(d.pagoMensual||0); },0))}</div>
        <div class="stat-sub">Monto restante total</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pago mensual total</div>
        <div class="stat-value" style="color:var(--amber)">${fmt(activas.reduce((s,d)=>s+(d.pagoMensual||0),0))}</div>
        <div class="stat-sub">Suma de mensualidades</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total ahorrado</div>
        <div class="stat-value" style="color:var(--green)">${fmt(activas.reduce((s,d)=>s+ahorradoDeuda(d),0))}</div>
        <div class="stat-sub">Para liquidar deudas</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Faltante total</div>
        <div class="stat-value" style="color:var(--red)">${fmt(activas.reduce((s,d)=>{ const r=Math.max(0,d.mensualidades-(d.pagos||[]).filter(p=>p.pagado).length); const rest=r*(d.pagoMensual||0); return s+Math.max(0,rest-ahorradoDeuda(d)); },0))}</div>
        <div class="stat-sub">Restando lo ahorrado</div>
      </div>
    </div>` : ''}

    <div class="deuda-table-wrap">
      <div class="section-label">Deudas activas</div>
      ${activas.length ? `<table class="deuda-table"><thead>${theadHTML}</thead><tbody>${activas.map(rowHTML).join('')}</tbody></table>`
        : '<div class="empty" style="border:none;border-radius:0">Sin deudas activas. ¡Bien hecho!</div>'}
    </div>

    ${pagadas.length ? `<div class="deuda-table-wrap pagadas-section">
      <div class="section-label">Deudas liquidadas</div>
      <table class="deuda-table"><thead>${theadHTML}</thead><tbody>${pagadas.map(pagadasRowHTML).join('')}</tbody></table>
    </div>` : ''}
  `;
}

window.guardarDeuda = async () => {
  const concepto  = document.getElementById('d-concepto').value.trim();
  const montoTotal= parseFloat(document.getElementById('d-total').value)||0;
  const pagoMensual=parseFloat(document.getElementById('d-mensual').value)||0;
  const mensualidades=parseInt(document.getElementById('d-mens').value)||0;
  const inicio    = document.getElementById('d-inicio').value;
  if(!concepto||!montoTotal||!mensualidades||!inicio) return alert('Completa los campos requeridos.');

  // Generar lista de mensualidades
  const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const [startY, startM] = inicio.split('-').map(Number);
  const pagos = Array.from({length:mensualidades},(_,i)=>{
    const totalM = (startM - 1) + i;
    const m = totalM % 12;
    const y = startY + Math.floor(totalM/12);
    return { num: i+1, label:`Mes ${i+1}: ${MESES[m]} ${y}`, pagado:false };
  });

  const id = Date.now().toString();
  const obj = {concepto,montoTotal,pagoMensual,mensualidades,inicio,aportacionesAhorro:[],pagos,liquidada:false,creadoEn:Date.now()};
  await setDoc(doc(db,'users',uid,'deudas',id), obj);
  deudas.push({id,...obj});
  closeModal();
  renderDeudas();
};

  showModal(`<div class="modal-title">${d.concepto}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div style="background:var(--surface2);border-radius:var(--rs);padding:12px">

      </div>
