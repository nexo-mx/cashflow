<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cashflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c0e; --surface: #131316; --surface2: #1c1c21; --surface3: #242429;
  --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.11);
  --text: #eeecea; --text2: #888580; --text3: #4a4845;
  --green: #3ecf8e; --green-dim: rgba(62,207,142,0.1); --green-border: rgba(62,207,142,0.25);
  --red: #f06c6c; --red-dim: rgba(240,108,108,0.1); --red-border: rgba(240,108,108,0.25);
  --amber: #f5a623; --amber-dim: rgba(245,166,35,0.1); --amber-border: rgba(245,166,35,0.25);
  --blue: #5b9cf6; --blue-dim: rgba(91,156,246,0.1); --blue-border: rgba(91,156,246,0.25);
  --gold: #c9a96e; --gold-dim: rgba(201,169,110,0.08); --r: 10px; --rs: 7px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* AUTH */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.auth-box{width:100%;max-width:380px}
.auth-logo{font-family:'Instrument Serif',serif;font-size:38px;color:var(--gold);margin-bottom:6px;letter-spacing:-.5px}
.auth-sub{font-size:13px;color:var(--text3);margin-bottom:32px}
.auth-tabs{display:flex;border-bottom:1px solid var(--border2);margin-bottom:24px}
.auth-tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.auth-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.auth-form{display:none}.auth-form.active{display:block}
.f-row{margin-bottom:14px}
.f-row label{display:block;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:6px}
.f-row input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;outline:none;transition:border-color .2s}
.f-row input:focus{border-color:var(--gold)}
.auth-btn{width:100%;padding:12px;background:var(--gold);border:none;border-radius:var(--rs);color:#0c0c0e;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;transition:opacity .15s}
.auth-btn:hover{opacity:.88}
.auth-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--text3);font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border2)}
.google-btn{width:100%;padding:11px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:10px}
.google-btn:hover{border-color:var(--border2);background:var(--surface3)}
.google-icon{width:18px;height:18px;flex-shrink:0}
.auth-error{font-size:12px;color:var(--red);margin-top:10px;min-height:18px}

/* APP */
#app{display:none;height:100vh;overflow:hidden;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:20px}
.brand{font-family:'Instrument Serif',serif;font-size:22px;color:var(--gold);letter-spacing:-.3px}
.nav-tabs{display:flex;gap:2px}
.nav-tab{padding:6px 14px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-radius:var(--rs);border:none;background:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.nav-tab:hover{color:var(--text);background:var(--surface2)}
.nav-tab.active{color:var(--gold);background:var(--gold-dim)}
.user-area{display:flex;align-items:center;gap:10px}
.user-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--border2)}
.user-name{font-size:12px;color:var(--text3);max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout-btn{background:none;border:1px solid var(--border2);color:var(--text3);padding:5px 12px;border-radius:var(--rs);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.logout-btn:hover{border-color:var(--red-border);color:var(--red)}

.content{flex:1;overflow:hidden;display:flex}
.page{display:none;width:100%;overflow-y:auto}
.page.active{display:flex;flex-direction:column}

/* SIDEBAR */
.mes-layout{display:grid;grid-template-columns:200px 1fr;height:100%;overflow:hidden}
.mes-sidebar{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:16px 0}
.sidebar-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);padding:0 16px 10px}
.mes-item{padding:9px 16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);transition:all .15s;display:flex;align-items:center;justify-content:space-between;border-left:2px solid transparent}
.mes-item:hover{color:var(--text);background:var(--surface2)}
.mes-item.active{color:var(--gold);background:var(--gold-dim);border-left-color:var(--gold)}
.mes-item-dot{width:6px;height:6px;border-radius:50%;background:var(--green);opacity:0;flex-shrink:0}
.mes-item.has-data .mes-item-dot{opacity:1}
.add-mes-btn{margin:10px 12px 0;padding:8px;background:none;border:1px dashed var(--border2);border-radius:var(--rs);color:var(--text3);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;width:calc(100% - 24px);transition:all .15s}
.add-mes-btn:hover{border-color:var(--gold);color:var(--gold)}

/* MES CONTENT */
.mes-content{overflow-y:auto;padding:28px}
.mes-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.mes-title{font-family:'Instrument Serif',serif;font-size:28px;color:var(--text);letter-spacing:-.3px}
.mes-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
@media(max-width:700px){.mes-stats{grid-template-columns:repeat(2,1fr)}.mes-layout{grid-template-columns:1fr}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:6px}
.stat-value{font-size:22px;font-weight:600;letter-spacing:-.5px}
.stat-sub{font-size:11px;color:var(--text3);margin-top:3px}

.section{margin-bottom:32px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3)}
.add-btn{background:var(--surface2);border:1px solid var(--border2);color:var(--text2);padding:6px 14px;border-radius:var(--rs);font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s}
.add-btn:hover{border-color:var(--gold);color:var(--gold)}

/* INGRESO CARD */
.ingreso-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.ingreso-card:hover{border-color:var(--border2)}
.ingreso-card.pagado{border-color:var(--green-border)}
.ingreso-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.pagado-toggle{width:24px;height:24px;border-radius:50%;border:2px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:12px;font-weight:700;color:transparent}
.pagado-toggle:hover{border-color:var(--green);color:var(--green)}
.pagado-toggle.on{background:var(--green);border-color:var(--green);color:#0c0c0e}
.ingreso-info{flex:1;min-width:0}
.ingreso-cliente{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ingreso-fecha{font-size:11px;color:var(--text3);margin-top:1px}
.ingreso-total{font-size:16px;font-weight:600;color:var(--text);text-align:right;white-space:nowrap}
.ingreso-cashflow{font-size:11px;color:var(--green);text-align:right;margin-top:1px}
.ingreso-chevron{color:var(--text3);font-size:11px;transition:transform .2s;margin-left:8px;flex-shrink:0}
.ingreso-card.open .ingreso-chevron{transform:rotate(180deg)}
.bolsas-area{padding:0 16px 14px;border-top:1px solid var(--border)}
.bolsas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.bolsa-chip{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);padding:10px 12px}
.bolsa-nombre{font-size:11px;color:var(--text3);font-weight:500;margin-bottom:3px}
.bolsa-monto{font-size:15px;font-weight:600;color:var(--text)}
.bolsa-chip.cashflow{border-color:var(--green-border);background:var(--green-dim)}
.bolsa-chip.cashflow .bolsa-nombre{color:var(--green)}
.bolsa-chip.cashflow .bolsa-monto{color:var(--green)}
.bolsas-actions{display:flex;gap:8px;margin-top:10px}
.action-sm{background:none;border:1px solid var(--border2);color:var(--text3);padding:5px 12px;border-radius:var(--rs);font-size:11px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s}
.action-sm:hover{color:var(--text)}
.action-sm.danger:hover{border-color:var(--red-border);color:var(--red)}

/* GASTOS */
.gasto-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border:1px solid var(--border);border-radius:var(--rs);margin-bottom:8px;background:var(--surface)}
.gasto-prio{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.prio-alta{background:var(--red)}.prio-media{background:var(--amber)}.prio-baja{background:var(--text3)}
.gasto-info{flex:1;min-width:0}
.gasto-desc{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gasto-fecha{font-size:11px;color:var(--text3);margin-top:1px}
.gasto-amount{font-size:14px;font-weight:600;color:var(--red);white-space:nowrap}
.del-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px 6px;font-size:14px;line-height:1;transition:color .15s;border-radius:4px}
.del-btn:hover{color:var(--red)}

/* CASHFLOW PLAN */
.cf-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.cf-header{padding:12px 16px;background:var(--green-dim);border-bottom:1px solid var(--green-border);display:flex;justify-content:space-between;align-items:center}
.cf-name{font-size:13px;font-weight:500;color:var(--green)}
.cf-badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap}
.badge-ok{background:var(--green-dim);color:var(--green);border-color:var(--green-border)}
.badge-warn{background:var(--amber-dim);color:var(--amber);border-color:var(--amber-border)}
.cf-alloc{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px}
.cf-alloc:last-child{border-bottom:none}
.cf-alloc-name{color:var(--text2)}
.cf-alloc-date{font-size:11px;color:var(--text3);margin-top:1px}
.cf-alloc-amt{font-weight:500;color:var(--red);white-space:nowrap}
.cf-reserved{padding:10px 16px;display:flex;justify-content:space-between;font-size:12px;color:var(--green);background:var(--green-dim);border-top:1px solid var(--green-border)}
.cf-leftover{padding:10px 16px;display:flex;justify-content:space-between;font-size:12px;color:var(--amber);background:var(--amber-dim);border-top:1px solid var(--amber-border)}
.no-cf{text-align:center;padding:32px;color:var(--text3);font-size:13px;border:1px dashed var(--border2);border-radius:var(--r)}
.cf-summary-box{background:var(--amber-dim);border:1px solid var(--amber-border);border-radius:var(--r);padding:16px;margin-top:16px}
.cf-summary-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--amber);margin-bottom:10px}
.cf-summary-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(245,166,35,.15)}
.cf-summary-row:last-child{border-bottom:none}
.cf-summary-label{color:var(--text2)}
.cf-summary-amt{font-weight:600;color:var(--amber)}

/* ANUAL */
.anual-content{padding:28px;overflow-y:auto}
.anual-title{font-family:'Instrument Serif',serif;font-size:28px;color:var(--text);letter-spacing:-.3px;margin-bottom:4px}
.anual-year{font-size:13px;color:var(--text3);margin-bottom:24px}
.anual-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
@media(max-width:600px){.anual-stats{grid-template-columns:1fr}}
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:28px}
.chart-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:16px}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-wrap{width:100%;display:flex;flex-direction:column;justify-content:flex-end;flex:1}
.bar{width:100%;border-radius:3px 3px 0 0;min-height:3px}
.bar-facturado{background:var(--blue-dim);border:1px solid var(--blue-border)}
.bar-label{font-size:9px;color:var(--text3);text-align:center;white-space:nowrap}
.anual-table{width:100%;border-collapse:collapse;font-size:13px}
.anual-table th{text-align:left;padding:10px 12px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);border-bottom:1px solid var(--border)}
.anual-table td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.anual-table tr:last-child td{border-bottom:none}
.anual-table tr:hover td{background:var(--surface2)}
.mes-link{color:var(--text);font-weight:500;cursor:pointer;transition:color .15s}
.mes-link:hover{color:var(--gold)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:500;opacity:0;pointer-events:none;transition:opacity .2s;padding:20px}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;transform:translateY(8px);transition:transform .2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-title{font-family:'Instrument Serif',serif;font-size:22px;color:var(--text);margin-bottom:20px;letter-spacing:-.2px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-btn{flex:1;padding:10px;border-radius:var(--rs);border:1px solid;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.modal-btn-primary{background:var(--gold);border-color:var(--gold);color:#0c0c0e}
.modal-btn-primary:hover{opacity:.88}
.modal-btn-ghost{background:transparent;border-color:var(--border2);color:var(--text2)}
.modal-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;outline:none;transition:border-color .2s}
.modal-input:focus{border-color:var(--gold)}
.modal-select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;outline:none}
.bolsa-editor-row{display:grid;grid-template-columns:1fr 110px auto auto;gap:8px;align-items:center;margin-bottom:8px}
.bolsa-editor-row input{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 10px;outline:none;width:100%}
.bolsa-editor-row input:focus{border-color:var(--gold)}
.cf-check{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);white-space:nowrap;cursor:pointer}
.cf-check input{accent-color:var(--green);width:14px;height:14px;cursor:pointer}
.rem-bolsa{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px 6px;font-size:16px;line-height:1;transition:color .15s;border-radius:4px}
.rem-bolsa:hover{color:var(--red)}
.add-bolsa-btn{background:none;border:1px dashed var(--border2);border-radius:var(--rs);color:var(--text3);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;padding:8px;width:100%;margin-top:4px;transition:all .15s}
.add-bolsa-btn:hover{border-color:var(--gold);color:var(--gold)}

/* UTILS */
.divider{border:none;border-top:1px solid var(--border);margin:24px 0}
.empty{text-align:center;padding:28px;color:var(--text3);font-size:13px;border:1px dashed var(--border2);border-radius:var(--r)}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite;margin:40px auto;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">Cashflow</div>
    <div class="auth-sub">Gestión inteligente de flujo de caja</div>

    <button class="google-btn" onclick="loginGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continuar con Google
    </button>

    <div class="auth-divider">o usa tu correo</div>

    <div class="auth-tabs">
      <div class="auth-tab active" onclick="showAuthTab('login')">Iniciar sesión</div>
      <div class="auth-tab" onclick="showAuthTab('registro')">Crear cuenta</div>
    </div>

    <div class="auth-form active" id="form-login">
      <div class="f-row"><label>Correo</label><input type="email" id="l-email" placeholder="tu@correo.com"></div>
      <div class="f-row"><label>Contraseña</label><input type="password" id="l-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"></div>
      <button class="auth-btn" onclick="login()">Entrar</button>
      <div class="auth-error" id="login-err"></div>
    </div>
    <div class="auth-form" id="form-registro">
      <div class="f-row"><label>Correo</label><input type="email" id="r-email" placeholder="tu@correo.com"></div>
      <div class="f-row"><label>Contraseña</label><input type="password" id="r-pass" placeholder="Mínimo 6 caracteres" onkeydown="if(event.key==='Enter')registro()"></div>
      <button class="auth-btn" onclick="registro()">Crear cuenta</button>
      <div class="auth-error" id="reg-err"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;flex-direction:column;height:100vh">
  <div class="topbar">
    <div class="topbar-left">
      <div class="brand">Cashflow</div>
      <div class="nav-tabs">
        <button class="nav-tab active" onclick="showPage('mes',this)">Mes</button>
        <button class="nav-tab" onclick="showPage('anual',this)">Año</button>
      </div>
    </div>
    <div class="user-area">
      <img id="user-avatar" class="user-avatar" src="" style="display:none">
      <span id="user-name" class="user-name"></span>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="content">
    <div class="page active" id="page-mes">
      <div class="mes-layout">
        <div class="mes-sidebar">
          <div class="sidebar-title">Meses</div>
          <div id="mes-list"></div>
          <button class="add-mes-btn" onclick="openNuevoMes()">＋ Nuevo mes</button>

import { getFirestore, doc, collection, getDocs, setDoc, deleteDoc, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const fbApp = initializeApp({
  apiKey: "AIzaSyD8JS-8fwIGWzX29bOVHc-yse3qt70X2cM",
  authDomain: "cashflow-a7fcc.firebaseapp.com",
  projectId: "cashflow-a7fcc",
  storageBucket: "cashflow-a7fcc.firebasestorage.app",
  messagingSenderId: "280921673419",
  appId: "1:280921673419:web:06b196662bafa52620d54e"
});
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const googleProvider = new GoogleAuthProvider();

// STATE
let uid = null, meses = [], activeMesId = null, mesData = {};

// AUTH
window.showAuthTab = (tab) => {
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='registro')));
  document.getElementById('form-login').classList.toggle('active', tab==='login');
  document.getElementById('form-registro').classList.toggle('active', tab==='registro');

window.loginGoogle = async () => {
  try { await signInWithPopup(auth, googleProvider); }
  catch(e) { document.getElementById('login-err').textContent = tradErr(e.code); }
};
window.login = async () => {
  const e=document.getElementById('l-email').value.trim(), p=document.getElementById('l-pass').value;

window.registro = async () => {
  const e=document.getElementById('r-email').value.trim(), p=document.getElementById('r-pass').value;

};
window.logout = () => signOut(auth);
function tradErr(c){
  return({'auth/invalid-email':'Correo inválido','auth/user-not-found':'No existe esa cuenta','auth/wrong-password':'Contraseña incorrecta','auth/invalid-credential':'Correo o contraseña incorrectos','auth/email-already-in-use':'Ese correo ya está registrado','auth/weak-password':'Mínimo 6 caracteres','auth/popup-closed-by-user':'Cerraste la ventana de Google'}[c]||'Error: '+c);

onAuthStateChanged(auth, async (user) => {
  if (user) {
    uid = user.uid;
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').style.display='flex';

    uid=null;

    document.getElementById('app').style.display='none';
  }
});

// NAV
window.showPage = (page, btn) => {

};

// MESES
async function loadMeses() {
  const snap = await getDocs(collection(db,'users',uid,'meses'));
  meses = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.orden-b.orden);
  renderSidebar();
  if (meses.length>0) selectMes(meses[meses.length-1].id);
}

function renderSidebar() {
  const list = document.getElementById('mes-list');
  if (!meses.length) { list.innerHTML='<div style="padding:12px 16px;font-size:12px;color:var(--text3)">Sin meses aún</div>'; return; }
  list.innerHTML = meses.map(m=>{
    const d=mesData[m.id], hasData=d&&(d.ingresos.length||d.gastos.length);
    return `<div class="mes-item ${m.id===activeMesId?'active':''} ${hasData?'has-data':''}" onclick="selectMes('${m.id}')">
      <span>${m.nombre}</span><span class="mes-item-dot"></span></div>`;
  }).join('');
}

window.selectMes = async (id) => {
  activeMesId=id; renderSidebar();
  if (!mesData[id]) await loadMesData(id);
  renderMes();
};

async function loadMesData(id) {
  const [iS,gS] = await Promise.all([
    getDocs(collection(db,'users',uid,'meses',id,'ingresos')),
    getDocs(collection(db,'users',uid,'meses',id,'gastos'))
  ]);
  mesData[id]={
    ingresos: iS.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')),
    gastos: gS.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''))
  };
}

window.openNuevoMes = () => {
  const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const now=new Date();
  const opts=Array.from({length:12},(_,i)=>{
    const m=(now.getMonth()+i)%12, y=now.getFullYear()+Math.floor((now.getMonth()+i)/12);
    return `<option>${MONTHS[m]} ${y}</option>`;
  }).join('');
  showModal(`<div class="modal-title">Nuevo mes</div>
    <div class="f-row"><label>Mes</label><select id="nm-sel" class="modal-select">${opts}</select></div>
    <div class="f-row"><label>O nombre personalizado</label><input id="nm-custom" class="modal-input" placeholder="Ej: Q2 2025, Freelance..."></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-primary" onclick="crearMes()">Crear</button>
      <button class="modal-btn modal-btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>`);
};

window.crearMes = async () => {
  const nombre=(document.getElementById('nm-custom').value.trim())||document.getElementById('nm-sel').value;
  const id=Date.now().toString();
  await setDoc(doc(db,'users',uid,'meses',id),{nombre,orden:Date.now()});
  meses.push({id,nombre,orden:Date.now()});
  mesData[id]={ingresos:[],gastos:[]};
  closeModal(); renderSidebar(); selectMes(id);
};

// RENDER MES
function renderMes() {
  const mes=meses.find(m=>m.id===activeMesId), data=mesData[activeMesId];
  if (!mes||!data) return;
  const totalFact=data.ingresos.reduce((s,i)=>s+(i.total||0),0);
  const totalCob=data.ingresos.filter(i=>i.pagado).reduce((s,i)=>s+(i.total||0),0);
  const totalCF=data.ingresos.filter(i=>i.pagado).reduce((s,i)=>{const cf=(i.bolsas||[]).find(b=>b.esCashflow);return s+(cf?cf.monto:0);},0);
  const totalGas=data.gastos.reduce((s,g)=>s+(g.monto||0),0);

  document.getElementById('mes-content').innerHTML=`
    <div class="mes-header">
      <div class="mes-title">${mes.nombre}</div>
      <button class="action-sm danger" onclick="eliminarMes()">Eliminar mes</button>
    </div>
    <div class="mes-stats">
      <div class="stat-card"><div class="stat-label">Facturado</div><div class="stat-value">${fmt(totalFact)}</div><div class="stat-sub">${data.ingresos.length} ingreso(s)</div></div>
      <div class="stat-card"><div class="stat-label">Cobrado</div><div class="stat-value" style="color:var(--green)">${fmt(totalCob)}</div><div class="stat-sub">${data.ingresos.filter(i=>i.pagado).length} pagado(s)</div></div>
      <div class="stat-card"><div class="stat-label">Cashflow</div><div class="stat-value" style="color:var(--amber)">${fmt(totalCF)}</div><div class="stat-sub">De cobrados</div></div>
      <div class="stat-card"><div class="stat-label">Gastos</div><div class="stat-value" style="color:var(--red)">${fmt(totalGas)}</div><div class="stat-sub">${data.gastos.length} gasto(s)</div></div>
    </div>
    <div class="section">
      <div class="section-header"><div class="section-title">Ingresos</div><button class="add-btn" onclick="openNuevoIngreso()">+ Agregar</button></div>
      ${data.ingresos.length?data.ingresos.map(renderIngresoCard).join(''):'<div class="empty">Sin ingresos. Agrega el primero.</div>'}
    </div>
    <div class="divider"></div>
    <div class="section">
      <div class="section-header"><div class="section-title">Gastos del mes</div><button class="add-btn" onclick="openNuevoGasto()">+ Agregar</button></div>
      ${data.gastos.length?data.gastos.map(renderGastoRow).join(''):'<div class="empty">Sin gastos registrados.</div>'}
    </div>
    <div class="divider"></div>
    <div class="section">
      <div class="section-title" style="margin-bottom:14px">Plan de cashflow</div>
      ${renderCashflowPlan(data)}
    </div>`;
}

function renderIngresoCard(ing) {
  const cf=(ing.bolsas||[]).find(b=>b.esCashflow), cfAmt=cf?cf.monto:0;
  return `<div class="ingreso-card ${ing.pagado?'pagado':''}" id="ic-${ing.id}">
    <div class="ingreso-header" onclick="toggleIngreso('${ing.id}')">
      <button class="pagado-toggle ${ing.pagado?'on':''}" onclick="event.stopPropagation();togglePagado('${ing.id}')" title="${ing.pagado?'Marcar pendiente':'Marcar cobrado'}">✓</button>
      <div class="ingreso-info">
        <div class="ingreso-cliente">${ing.cliente}</div>
        <div class="ingreso-fecha">${fmtDate(ing.fecha)} · ${ing.pagado?'<span style="color:var(--green);font-weight:500">Cobrado</span>':'Pendiente'}</div>
      </div>
      <div style="text-align:right">
        <div class="ingreso-total">${fmt(ing.total||0)}</div>
        ${cfAmt>0?`<div class="ingreso-cashflow">CF: ${fmt(cfAmt)}</div>`:''}
      </div>
      <span class="ingreso-chevron">▼</span>
    </div>
    <div class="bolsas-area" style="display:none" id="bolsas-${ing.id}">
      ${renderBolsas(ing)}
      <div class="bolsas-actions">
        <button class="action-sm" onclick="openEditarIngreso('${ing.id}')">Editar</button>
        <button class="action-sm danger" onclick="eliminarIngreso('${ing.id}')">Eliminar</button>
      </div>
    </div>
  </div>`;
}

function renderBolsas(ing) {
  const bolsas=ing.bolsas||[];
  if (!bolsas.length) return '<div style="font-size:12px;color:var(--text3);padding:8px 0">Sin bolsas definidas.</div>';
  return `<div class="bolsas-grid">${bolsas.map(b=>`<div class="bolsa-chip ${b.esCashflow?'cashflow':''}"><div class="bolsa-nombre">${b.nombre}${b.esCashflow?' ✦':''}</div><div class="bolsa-monto">${fmt(b.monto)}</div></div>`).join('')}</div>`;
}

function renderGastoRow(g) {
  return `<div class="gasto-row">
    <div class="gasto-prio prio-${g.prioridad||'media'}"></div>
    <div class="gasto-info"><div class="gasto-desc">${g.descripcion}</div><div class="gasto-fecha">${fmtDate(g.fecha)} · ${g.prioridad||'media'}</div></div>
    <div class="gasto-amount">−${fmt(g.monto)}</div>
    <button class="del-btn" onclick="eliminarGasto('${g.id}')">✕</button>
  </div>`;
}

function renderCashflowPlan(data) {
  const cfIngresos=data.ingresos.filter(i=>{const cf=(i.bolsas||[]).find(b=>b.esCashflow);return cf&&cf.monto>0&&i.pagado;});
  if (!cfIngresos.length) return '<div class="no-cf">Marca ingresos como cobrados y define su bolsa de cashflow para ver el plan.</div>';

  const gastos=[...data.gastos].sort((a,b)=>{
    const p={alta:0,media:1,baja:2};
    if(a.fecha!==b.fecha) return (a.fecha||'').localeCompare(b.fecha||'');
    return (p[a.prioridad]||1)-(p[b.prioridad]||1);
  });

  let incW=cfIngresos.map(i=>{const cf=i.bolsas.find(b=>b.esCashflow);return{...i,cfAmount:cf.monto,remaining:cf.monto,allocations:[]};});
  let expW=gastos.map(e=>({...e,covered:false,uncovered:0}));

  for (let exp of expW) {
    let cands=incW.filter(i=>i.remaining>0&&(i.fecha||'')<=(exp.fecha||''));
    if (!cands.length) cands=incW.filter(i=>i.remaining>0).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
    else cands.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
    // prefer single source that can cover fully
    const single=cands.find(i=>i.remaining>=exp.monto);
    if (single) {
      single.remaining-=exp.monto;
      single.allocations.push({desc:exp.descripcion,fecha:exp.fecha,amount:exp.monto,prioridad:exp.prioridad});
      exp.covered=true;
    } else {
      let rem=exp.monto;
      for (let inc of cands){if(rem<=0)break;const take=Math.min(inc.remaining,rem);inc.remaining-=take;rem-=take;inc.allocations.push({desc:exp.descripcion,fecha:exp.fecha,amount:take,prioridad:exp.prioridad});}
      if(rem<=0)exp.covered=true;else exp.uncovered=rem;
    }
  }

  const totalSobrante=incW.reduce((s,i)=>s+i.remaining,0);
  const uncovered=expW.filter(e=>!e.covered);

  let html=incW.map(inc=>{
    const reserved=inc.cfAmount-inc.remaining;
    const badge=inc.remaining>0?`<span class="cf-badge badge-ok">Sobra ${fmt(inc.remaining)}</span>`:`<span class="cf-badge badge-warn">Sin sobrante</span>`;
    let h=`<div class="cf-card"><div class="cf-header"><div><div class="cf-name">💰 ${inc.cliente}</div><div style="font-size:11px;color:rgba(62,207,142,.6);margin-top:2px">CF: ${fmt(inc.cfAmount)} · cobrado ${fmtDate(inc.fecha)}</div></div>${badge}</div>`;
    if (!inc.allocations.length) h+=`<div class="cf-alloc"><span style="color:var(--text3)">Sin gastos asignados.</span></div>`;
    else inc.allocations.forEach(a=>{const pc=a.prioridad==='alta'?'var(--red)':a.prioridad==='media'?'var(--amber)':'var(--text3)';h+=`<div class="cf-alloc"><div><div class="cf-alloc-name">${a.desc}</div><div class="cf-alloc-date">Fecha: ${fmtDate(a.fecha)} · <span style="color:${pc}">${a.prioridad||'media'}</span></div></div><div class="cf-alloc-amt">−${fmt(a.amount)}</div></div>`;});
    if(reserved>0)h+=`<div class="cf-reserved"><span>Reservado para gastos</span><span>${fmt(reserved)}</span></div>`;
    if(inc.remaining>0)h+=`<div class="cf-leftover"><span>✦ Sobrante libre</span><span>${fmt(inc.remaining)}</span></div>`;
    h+=`</div>`;return h;
  }).join('');

  if(uncovered.length) html+=`<div style="background:var(--red-dim);border:1px solid var(--red-border);border-radius:var(--rs);padding:12px 16px;font-size:13px;color:var(--red);margin-top:12px">⚠️ Sin cobertura: ${uncovered.map(e=>`${e.descripcion} (faltan ${fmt(e.uncovered||e.monto)})`).join(', ')}</div>`;
  if(totalSobrante>0) html+=`<div class="cf-summary-box"><div class="cf-summary-title">✦ Sobrantes por ingreso</div>${incW.filter(i=>i.remaining>0).map(i=>`<div class="cf-summary-row"><div class="cf-summary-label">${i.cliente}</div><div class="cf-summary-amt">${fmt(i.remaining)}</div></div>`).join('')}</div>`;
  return html;
}

// TOGGLE
window.toggleIngreso = (id) => {
  const card=document.getElementById('ic-'+id), bolsas=document.getElementById('bolsas-'+id), open=card.classList.contains('open');
  card.classList.toggle('open',!open); bolsas.style.display=open?'none':'block';
};
window.togglePagado = async (id) => {
  const ing=mesData[activeMesId].ingresos.find(i=>i.id===id);
  ing.pagado=!ing.pagado;
  await updateDoc(doc(db,'users',uid,'meses',activeMesId,'ingresos',id),{pagado:ing.pagado});

// INGRESOS CRUD
window.openNuevoIngreso = () => showModal(buildIngresoModal(null));
window.openEditarIngreso = (id) => showModal(buildIngresoModal(mesData[activeMesId].ingresos.find(i=>i.id===id)));

function buildIngresoModal(ing) {
  const today=new Date().toISOString().split('T')[0];
  const bolsas=ing?.bolsas||[{nombre:'Nómina',monto:'',esCashflow:false},{nombre:'Impuestos',monto:'',esCashflow:false},{nombre:'Cashflow',monto:'',esCashflow:true}];
  const bHTML=bolsas.map((b,i)=>`<div class="bolsa-editor-row" id="brow-${i}">
    <input type="text" placeholder="Nombre" value="${b.nombre||''}" id="bn-${i}">
    <input type="number" placeholder="Monto" value="${b.monto||''}" id="bm-${i}">
    <label class="cf-check"><input type="checkbox" id="bc-${i}" ${b.esCashflow?'checked':''}> CF</label>
    <button class="rem-bolsa" onclick="remBolsa(${i})">×</button></div>`).join('');
  return `<div class="modal-title">${ing?'Editar ingreso':'Nuevo ingreso'}</div>
    <div class="f-row"><label>Cliente / Fuente</label><input id="ing-cliente" class="modal-input" value="${ing?.cliente||''}" placeholder="Nombre del cliente"></div>
    <div class="f-row"><label>Monto total</label><input id="ing-total" class="modal-input" type="number" value="${ing?.total||''}" placeholder="0.00"></div>
    <div class="f-row"><label>Fecha esperada de cobro</label><input id="ing-fecha" class="modal-input" type="date" value="${ing?.fecha||today}"></div>
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin:16px 0 8px">Distribución por bolsas</div>
    <div style="display:grid;grid-template-columns:1fr 110px auto auto;gap:8px;margin-bottom:6px">
      <span style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text3)">Nombre</span>
      <span style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text3)">Monto</span>
      <span style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--green)">CF</span><span></span>
    </div>
    <div id="bolsas-editor">${bHTML}</div>
    <button class="add-bolsa-btn" onclick="addBolsa()">＋ Agregar bolsa</button>
    <div style="font-size:11px;color:var(--text3);margin-top:6px">Marca CF ✦ en la bolsa que va al cashflow</div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-primary" onclick="guardarIngreso('${ing?.id||''}')">Guardar</button>
      <button class="modal-btn modal-btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>`;
}

window.addBolsa = () => {
  const c=document.getElementById('bolsas-editor'), i=c.children.length;
  const d=document.createElement('div'); d.className='bolsa-editor-row'; d.id=`brow-${i}`;
  d.innerHTML=`<input type="text" placeholder="Nombre" id="bn-${i}"><input type="number" placeholder="Monto" id="bm-${i}"><label class="cf-check"><input type="checkbox" id="bc-${i}"> CF</label><button class="rem-bolsa" onclick="remBolsa(${i})">×</button>`;
  c.appendChild(d);
};
window.remBolsa = (i) => { const r=document.getElementById('brow-'+i); if(r) r.remove(); };

window.guardarIngreso = async (existingId) => {
  const cliente=document.getElementById('ing-cliente').value.trim();
  const total=parseFloat(document.getElementById('ing-total').value)||0;
  const fecha=document.getElementById('ing-fecha').value;
  if (!cliente||!fecha) return alert('Completa cliente y fecha.');
  const rows=document.querySelectorAll('#bolsas-editor .bolsa-editor-row');
  const bolsas=[];
  rows.forEach((_,i)=>{
    const n=document.getElementById(`bn-${i}`)?.value?.trim();
    const m=parseFloat(document.getElementById(`bm-${i}`)?.value)||0;
    const cf=document.getElementById(`bc-${i}`)?.checked||false;
    if(n) bolsas.push({nombre:n,monto:m,esCashflow:cf});
  });
  const id=existingId||Date.now().toString();
  const existing=existingId?mesData[activeMesId].ingresos.find(i=>i.id===existingId):null;
  const obj={cliente,total,fecha,bolsas,pagado:existing?.pagado||false};
  await setDoc(doc(db,'users',uid,'meses',activeMesId,'ingresos',id),obj);
  if(existingId){const idx=mesData[activeMesId].ingresos.findIndex(i=>i.id===existingId);mesData[activeMesId].ingresos[idx]={id,...obj};}
  else mesData[activeMesId].ingresos.push({id,...obj});
  closeModal(); renderMes(); renderSidebar();
};

window.eliminarIngreso = async (id) => {
  if(!confirm('¿Eliminar este ingreso?')) return;
  await deleteDoc(doc(db,'users',uid,'meses',activeMesId,'ingresos',id));
  mesData[activeMesId].ingresos=mesData[activeMesId].ingresos.filter(i=>i.id!==id);
  renderMes();
};

// GASTOS CRUD
window.openNuevoGasto = () => {
  const today=new Date().toISOString().split('T')[0];
  showModal(`<div class="modal-title">Nuevo gasto</div>
    <div class="f-row"><label>Descripción</label><input id="g-desc" class="modal-input" placeholder="Ej: Renta, luz, tarjeta..."></div>
    <div class="f-row"><label>Monto</label><input id="g-monto" class="modal-input" type="number" placeholder="0.00"></div>
    <div class="f-row"><label>Fecha límite</label><input id="g-fecha" class="modal-input" type="date" value="${today}"></div>
    <div class="f-row"><label>Prioridad</label><select id="g-prio" class="modal-select">
      <option value="alta">Alta — No puede esperar</option>
      <option value="media" selected>Media — Flexible</option>
      <option value="baja">Baja — Puede esperar</option>
    </select></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-primary" onclick="guardarGasto()">Guardar</button>
      <button class="modal-btn modal-btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>`);
};

window.guardarGasto = async () => {
  const descripcion=document.getElementById('g-desc').value.trim();
  const monto=parseFloat(document.getElementById('g-monto').value);
  const fecha=document.getElementById('g-fecha').value;
  const prioridad=document.getElementById('g-prio').value;
  if(!descripcion||!monto||!fecha) return alert('Completa todos los campos.');
  const id=Date.now().toString(), obj={descripcion,monto,fecha,prioridad};
  await setDoc(doc(db,'users',uid,'meses',activeMesId,'gastos',id),obj);
  mesData[activeMesId].gastos.push({id,...obj});
  mesData[activeMesId].gastos.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  closeModal(); renderMes();
};

window.eliminarGasto = async (id) => {
  if(!confirm('¿Eliminar?')) return;
  await deleteDoc(doc(db,'users',uid,'meses',activeMesId,'gastos',id));
  mesData[activeMesId].gastos=mesData[activeMesId].gastos.filter(g=>g.id!==id);
  renderMes();
};

window.eliminarMes = async () => {
  const mes=meses.find(m=>m.id===activeMesId);
  if(!confirm(`¿Eliminar "${mes?.nombre}"?`)) return;
  await deleteDoc(doc(db,'users',uid,'meses',activeMesId));
  meses=meses.filter(m=>m.id!==activeMesId); delete mesData[activeMesId]; activeMesId=null;
  renderSidebar();
  document.getElementById('mes-content').innerHTML='<div class="empty" style="margin-top:60px">Selecciona o crea un mes.</div>';
};

// ANUAL
async function renderAnual() {
  const c=document.getElementById('anual-content');
  c.innerHTML='<div class="spinner"></div>';
  for(const m of meses) if(!mesData[m.id]) await loadMesData(m.id);
  const year=new Date().getFullYear();
  const totalFact=meses.reduce((s,m)=>s+(mesData[m.id]?.ingresos||[]).reduce((ss,i)=>ss+(i.total||0),0),0);
  const totalCob=meses.reduce((s,m)=>s+(mesData[m.id]?.ingresos||[]).filter(i=>i.pagado).reduce((ss,i)=>ss+(i.total||0),0),0);
  const totalCF=meses.reduce((s,m)=>s+(mesData[m.id]?.ingresos||[]).filter(i=>i.pagado).reduce((ss,i)=>{const cf=(i.bolsas||[]).find(b=>b.esCashflow);return ss+(cf?cf.monto:0);},0),0);
  const maxFact=Math.max(...meses.map(m=>(mesData[m.id]?.ingresos||[]).reduce((s,i)=>s+(i.total||0),0)),1);
  const bars=meses.map(m=>{
    const f=(mesData[m.id]?.ingresos||[]).reduce((s,i)=>s+(i.total||0),0);
    const pct=Math.round(f/maxFact*100);
    return `<div class="bar-col"><div class="bar-wrap"><div class="bar bar-facturado" style="height:${pct}%" title="${fmt(f)}"></div></div><div class="bar-label">${m.nombre.substring(0,3)}</div></div>`;
  }).join('');
  const rows=meses.length?meses.map(m=>{
    const d=mesData[m.id]||{ingresos:[],gastos:[]};
    const f=d.ingresos.reduce((s,i)=>s+(i.total||0),0);
    const cob=d.ingresos.filter(i=>i.pagado).reduce((s,i)=>s+(i.total||0),0);
    const pend=f-cob;
    const cf=d.ingresos.filter(i=>i.pagado).reduce((s,i)=>{const b=(i.bolsas||[]).find(b=>b.esCashflow);return s+(b?b.monto:0);},0);
    const gas=d.gastos.reduce((s,g)=>s+(g.monto||0),0);
    return `<tr>
      <td><span class="mes-link" onclick="goToMes('${m.id}')">${m.nombre}</span></td>
      <td style="font-weight:600">${fmt(f)}</td>
      <td style="font-weight:600;color:var(--green)">${fmt(cob)}${pend>0?`<br><span style="font-size:11px;color:var(--amber)">Pend: ${fmt(pend)}</span>`:''}</td>
      <td style="font-weight:600;color:var(--amber)">${fmt(cf)}</td>
      <td style="font-weight:600;color:var(--red)">${fmt(gas)}</td>
    </tr>`;
  }).join(''):'<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text3)">Sin meses registrados</td></tr>';

  c.innerHTML=`
    <div class="anual-title">Resumen anual</div>
    <div class="anual-year">${year}</div>
    <div class="anual-stats">
      <div class="stat-card"><div class="stat-label">Total facturado</div><div class="stat-value">${fmt(totalFact)}</div><div class="stat-sub">Todos los meses</div></div>
      <div class="stat-card"><div class="stat-label">Total cobrado</div><div class="stat-value" style="color:var(--green)">${fmt(totalCob)}</div><div class="stat-sub">${totalFact>0?Math.round(totalCob/totalFact*100):0}% del facturado</div></div>
      <div class="stat-card"><div class="stat-label">Cashflow total</div><div class="stat-value" style="color:var(--amber)">${fmt(totalCF)}</div><div class="stat-sub">De ingresos cobrados</div></div>
    </div>
    ${meses.length?`<div class="chart-wrap"><div class="chart-title">Facturado por mes</div><div class="chart-bars">${bars}</div></div>`:''}
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
      <table class="anual-table">
        <thead><tr><th>Mes</th><th>Facturado</th><th>Cobrado</th><th>Cashflow</th><th>Gastos</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

window.goToMes = (id) => {
  document.querySelectorAll('.nav-tab')[0].click();
  selectMes(id);
};

// MODAL
function showModal(html){document.getElementById('modal-box').innerHTML=html;document.getElementById('modal-overlay').classList.add('open');}
window.closeModal=()=>document.getElementById('modal-overlay').classList.remove('open');
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('modal-overlay'))window.closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')window.closeModal();});

// FORMAT
function fmt(n){return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(d){if(!d)return'—';const[y,m,day]=d.split('-'),ms=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return`${parseInt(day)} ${ms[parseInt(m)-1]} ${y}`;}
</script>
